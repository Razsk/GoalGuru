    function findNodeRootGoal(nodeId, allNodes) {
      if (!nodeId || !allNodes) return null;
      const nodeMap = new Map(allNodes.map(n => [n.id, n]));
      let curr = nodeMap.get(nodeId);
      while (curr) {
        if (curr.type === 'goal') return curr;
        if (!curr.parentId) break;
        curr = nodeMap.get(curr.parentId);
      }
      return null;
    }

    // --- Miro-Inspired Visual Dependency Graph & Scope Filtering View ---
    function DependenciesView({ graphData, workspaceId, onRefreshGraph, onToggleStatus, onExport, onAddEvidence, showToast }) {
      const [viewMode, setViewMode] = useState('canvas'); // 'canvas' | 'cards' | 'matrix'
      const [orientation, setOrientation] = useState('horizontal'); // 'horizontal' (LR) | 'vertical' (TB)
      
      // Scope filters
      const [goalScope, setGoalScope] = useState('all'); // 'all' | 'cross_goal_only' | specific goal id
      const [connectedOnly, setConnectedOnly] = useState(true); // Default true to prevent clutter
      const [includeDone, setIncludeDone] = useState(true); // Toggle Done nodes
      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'blocked' | 'ready' | 'in_progress' | 'done'
      const [filterType, setFilterType] = useState('all'); // 'all' | 'goal' | 'milestone' | 'action'
      const [searchQuery, setSearchQuery] = useState('');

      // Interactive Canvas State
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const [hoveredNodeId, setHoveredNodeId] = useState(null);
      const [hoveredEdge, setHoveredEdge] = useState(null);
      const [pan, setPan] = useState({ x: 50, y: 50 });
      const [zoom, setZoom] = useState(1);
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [panStart, setPanStart] = useState({ x: 0, y: 0 });
      const [addDepModal, setAddDepModal] = useState({ isOpen: false, fromId: '', toId: '' });
      const [connecting, setConnecting] = useState(null);

      const canvasRef = useRef(null);

      const nodes = useMemo(() => (graphData.nodes || []).filter(n => !n.archivedAt), [graphData.nodes]);
      const activeNodeIds = useMemo(() => new Set(nodes.map(n => n.id)), [nodes]);
      const dependencies = useMemo(() => (graphData.dependencies || []).filter(d => activeNodeIds.has(d.fromNodeId) && activeNodeIds.has(d.toNodeId)), [graphData.dependencies, activeNodeIds]);
      const readinessMap = graphData.readiness || {};

      const nodeMap = useMemo(() => {
        const m = new Map();
        nodes.forEach(n => m.set(n.id, n));
        return m;
      }, [nodes]);

      // Screen to Canvas Coordinates Converter
      const getCanvasCoordinates = useCallback((clientX, clientY) => {
        if (!canvasRef.current) return { x: 0, y: 0 };
        const rect = canvasRef.current.getBoundingClientRect();
        return {
          x: (clientX - rect.left - pan.x) / zoom,
          y: (clientY - rect.top - pan.y) / zoom,
        };
      }, [pan, zoom]);

      // Connection Validation (ADR 0001, ADR 0003 & Cycle Prevention)
      const evaluateConnectionTarget = useCallback((fromId, toId) => {
        if (!fromId || !toId) return { isValid: false, reason: null };
        if (fromId === toId) return { isValid: false, reason: 'Cannot connect a task to itself' };

        const fromNode = nodeMap.get(fromId);
        const toNode = nodeMap.get(toId);
        if (!fromNode || !toNode) return { isValid: false, reason: 'Node not found' };

        // ADR 0001 & ADR 0003: Dependencies are allowed between Actions and Milestones
        if (fromNode.type === 'goal' || toNode.type === 'goal') {
          return { isValid: false, reason: 'Goals cannot have direct dependencies' };
        }

        // Check duplicate
        const exists = dependencies.some(d => d.fromNodeId === fromId && d.toNodeId === toId);
        if (exists) {
          return { isValid: false, reason: 'Dependency link already exists' };
        }

        // Check cycle
        const wouldCycle = checkWouldCreateCycle(fromId, toId, dependencies);
        if (wouldCycle) {
          return { isValid: false, reason: 'Circular dependency detected' };
        }

        return { isValid: true, reason: null };
      }, [nodeMap, dependencies]);

      // All root goals & assigned colors
      const rootGoals = useMemo(() => {
        return nodes.filter(n => n.type === 'goal');
      }, [nodes]);

      const goalColorMap = useMemo(() => {
        const m = new Map();
        rootGoals.forEach((g, idx) => {
          m.set(g.id, GOAL_COLOR_PALETTES[idx % GOAL_COLOR_PALETTES.length]);
        });
        return m;
      }, [rootGoals]);

      // Map every node to its root goal
      const nodeGoalMap = useMemo(() => {
        const m = new Map();
        nodes.forEach(n => {
          m.set(n.id, findNodeRootGoal(n.id, nodes));
        });
        return m;
      }, [nodes]);

      // Identify connected node IDs
      const connectedNodeIds = useMemo(() => {
        const s = new Set();
        dependencies.forEach(d => {
          s.add(d.fromNodeId);
          s.add(d.toNodeId);
        });
        return s;
      }, [dependencies]);

      // Cross-goal dependency edges
      const crossGoalDeps = useMemo(() => {
        return dependencies.filter(d => {
          const fromG = nodeGoalMap.get(d.fromNodeId);
          const toG = nodeGoalMap.get(d.toNodeId);
          return fromG && toG && fromG.id !== toG.id;
        });
      }, [dependencies, nodeGoalMap]);

      // KPI Metrics Summary
      const metrics = useMemo(() => {
        const totalNodes = nodes.length;
        const containmentEdges = nodes.filter(n => n.parentId).length;
        const dependencyEdges = dependencies.length;
        const crossGoalCount = crossGoalDeps.length;
        const blockedNodes = nodes.filter(n => readinessMap[n.id]?.readiness === 'blocked').length;
        const doneNodes = nodes.filter(n => n.status === 'done').length;

        // Count how many items each node unblocks
        const unblockCount = new Map();
        dependencies.forEach(d => {
          unblockCount.set(d.fromNodeId, (unblockCount.get(d.fromNodeId) || 0) + 1);
        });

        let topBottleneck = null;
        let maxUnblocks = 0;
        for (const [nId, count] of unblockCount.entries()) {
          if (count > maxUnblocks) {
            maxUnblocks = count;
            topBottleneck = nodeMap.get(nId);
          }
        }

        return {
          totalNodes,
          containmentEdges,
          dependencyEdges,
          crossGoalCount,
          blockedNodes,
          doneNodes,
          topBottleneck,
          maxUnblocks
        };
      }, [nodes, dependencies, crossGoalDeps, readinessMap, nodeMap]);

      // Node relations lookup
      const nodeRelations = useMemo(() => {
        const m = new Map();
        nodes.forEach(n => {
          m.set(n.id, {
            node: n,
            rootGoal: nodeGoalMap.get(n.id),
            parent: n.parentId ? nodeMap.get(n.parentId) : null,
            children: nodes.filter(c => c.parentId === n.id),
            prerequisites: dependencies.filter(d => d.toNodeId === n.id).map(d => nodeMap.get(d.fromNodeId)).filter(Boolean),
            dependents: dependencies.filter(d => d.fromNodeId === n.id).map(d => nodeMap.get(d.toNodeId)).filter(Boolean),
            readinessInfo: readinessMap[n.id] || { readiness: 'ready', blockingNodeIds: [], blockingNodeTitles: [] }
          });
        });
        return m;
      }, [nodes, dependencies, nodeMap, nodeGoalMap, readinessMap]);

      // Filtered Nodes for Canvas & Cards
      const filteredNodes = useMemo(() => {
        return nodes.filter(n => {
          // Connected filter: if checked, must have at least one dependency/dependent (unless no deps exist at all)
          if (connectedOnly && dependencies.length > 0 && !connectedNodeIds.has(n.id)) {
            return false;
          }

          // Goal Scope filter
          if (goalScope === 'cross_goal_only') {
            const hasCrossDep = dependencies.some(d => {
              if (d.fromNodeId !== n.id && d.toNodeId !== n.id) return false;
              const gFrom = nodeGoalMap.get(d.fromNodeId);
              const gTo = nodeGoalMap.get(d.toNodeId);
              return gFrom && gTo && gFrom.id !== gTo.id;
            });
            if (!hasCrossDep) return false;
          } else if (goalScope !== 'all') {
            const g = nodeGoalMap.get(n.id);
            // Include node if it belongs to goal, OR is an immediate prerequisite/dependent of this goal
            const isInside = g && g.id === goalScope;
            const isExternalBoundary = dependencies.some(d => {
              if (d.fromNodeId === n.id) {
                const targetG = nodeGoalMap.get(d.toNodeId);
                return targetG && targetG.id === goalScope;
              }
              if (d.toNodeId === n.id) {
                const sourceG = nodeGoalMap.get(d.fromNodeId);
                return sourceG && sourceG.id === goalScope;
              }
              return false;
            });
            if (!isInside && !isExternalBoundary) return false;
          }

          // Type filter
          if (filterType !== 'all') {
            if (filterType === 'goal' && n.type !== 'goal') return false;
            if (filterType === 'milestone' && (n.type !== 'milestone' && n.type !== 'sub_goal')) return false;
            if (filterType === 'action' && (n.type !== 'action' && n.type !== 'sub_action')) return false;
          }

          // Status & Readiness filter
          if (!includeDone && n.status === 'done' && filterStatus !== 'done') return false;
          if (filterStatus === 'blocked' && readinessMap[n.id]?.readiness !== 'blocked') return false;
          if (filterStatus === 'ready' && (readinessMap[n.id]?.readiness === 'blocked' || n.status === 'done')) return false;
          if (filterStatus === 'in_progress' && n.status !== 'in_progress') return false;
          if (filterStatus === 'done' && n.status !== 'done') return false;

          // Search query filter
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = n.title && n.title.toLowerCase().includes(q);
            const matchDesc = n.description && n.description.toLowerCase().includes(q);
            if (!matchTitle && !matchDesc) return false;
          }

          return true;
        });
      }, [nodes, dependencies, connectedNodeIds, connectedOnly, includeDone, goalScope, nodeGoalMap, filterType, filterStatus, readinessMap, searchQuery]);

      const filteredNodeIdSet = useMemo(() => {
        return new Set(filteredNodes.map(n => n.id));
      }, [filteredNodes]);

      // Filtered dependencies: edges where at least one or both endpoints are visible
      const visibleDeps = useMemo(() => {
        return dependencies.filter(d => filteredNodeIdSet.has(d.fromNodeId) && filteredNodeIdSet.has(d.toNodeId));
      }, [dependencies, filteredNodeIdSet]);

      // Active Causal Highlighting: Upstream & Downstream Sets
      const activeHighlightSet = useMemo(() => {
        const activeId = selectedNodeId || hoveredNodeId;
        if (!activeId) return null;

        const upstream = new Set();
        const downstream = new Set();
        const activeEdges = new Set();

        // Recursively find upstream prerequisites
        function findUpstream(id) {
          dependencies.forEach(d => {
            if (d.toNodeId === id && !upstream.has(d.fromNodeId)) {
              upstream.add(d.fromNodeId);
              activeEdges.add(d.fromNodeId + '->' + d.toNodeId);
              findUpstream(d.fromNodeId);
            }
          });
        }

        // Recursively find downstream dependents
        function findDownstream(id) {
          dependencies.forEach(d => {
            if (d.fromNodeId === id && !downstream.has(d.toNodeId)) {
              downstream.add(d.toNodeId);
              activeEdges.add(d.fromNodeId + '->' + d.toNodeId);
              findDownstream(d.toNodeId);
            }
          });
        }

        findUpstream(activeId);
        findDownstream(activeId);

        return {
          activeId,
          upstream,
          downstream,
          activeEdges
        };
      }, [selectedNodeId, hoveredNodeId, dependencies]);

      // Miro DAG Layout Computation: Topological Ranker & Coordinate Calculation
      const dagLayout = useMemo(() => {
        if (filteredNodes.length === 0) {
          return { nodeCoords: new Map(), bounds: { width: 800, height: 600 }, layers: [] };
        }

        const CARD_W = 230;
        const CARD_H = 92;
        const GAP_LAYER = orientation === 'horizontal' ? 120 : 100;
        const GAP_ITEM = orientation === 'horizontal' ? 28 : 36;

        // In-degree calculation for visible subgraph
        const inDegree = new Map();
        const outgoing = new Map();
        filteredNodes.forEach(n => {
          inDegree.set(n.id, 0);
          outgoing.set(n.id, []);
        });

        visibleDeps.forEach(d => {
          if (inDegree.has(d.toNodeId) && outgoing.has(d.fromNodeId)) {
            inDegree.set(d.toNodeId, inDegree.get(d.toNodeId) + 1);
            outgoing.get(d.fromNodeId).push(d.toNodeId);
          }
        });

        // Compute topological layers (Sugiyama rank)
        const rankMap = new Map();
        let queue = [];

        filteredNodes.forEach(n => {
          if (inDegree.get(n.id) === 0) {
            rankMap.set(n.id, 0);
            queue.push(n.id);
          }
        });

        // If cycle or disconnected islands without in-degree 0
        if (queue.length === 0 && filteredNodes.length > 0) {
          rankMap.set(filteredNodes[0].id, 0);
          queue.push(filteredNodes[0].id);
        }

        let visitedCount = 0;
        while (queue.length > 0 && visitedCount < filteredNodes.length * 3) {
          const u = queue.shift();
          visitedCount++;
          const uRank = rankMap.get(u) || 0;

          (outgoing.get(u) || []).forEach(v => {
            const nextRank = Math.max(rankMap.get(v) || 0, uRank + 1);
            rankMap.set(v, nextRank);
            inDegree.set(v, inDegree.get(v) - 1);
            if (inDegree.get(v) <= 0 && !queue.includes(v)) {
              queue.push(v);
            }
          });
        }

        // Catch any remaining nodes
        filteredNodes.forEach(n => {
          if (!rankMap.has(n.id)) {
            rankMap.set(n.id, 0);
          }
        });

        // Group into layers
        let maxRank = 0;
        const layerBuckets = new Map();
        filteredNodes.forEach(n => {
          const r = rankMap.get(n.id) || 0;
          if (r > maxRank) maxRank = r;
          if (!layerBuckets.has(r)) layerBuckets.set(r, []);
          layerBuckets.get(r).push(n);
        });

        const layers = [];
        for (let r = 0; r <= maxRank; r++) {
          if (layerBuckets.has(r)) {
            layers.push({ rank: r, items: layerBuckets.get(r) });
          }
        }

        // Calculate 2D coordinates
        const nodeCoords = new Map();
        let maxX = 0;
        let maxY = 0;

        layers.forEach((layer, layerIdx) => {
          const items = layer.items;
          items.forEach((node, itemIdx) => {
            let x, y;
            if (orientation === 'horizontal') {
              x = 50 + layerIdx * (CARD_W + GAP_LAYER);
              y = 50 + itemIdx * (CARD_H + GAP_ITEM);
            } else {
              x = 50 + itemIdx * (CARD_W + GAP_ITEM);
              y = 50 + layerIdx * (CARD_H + GAP_LAYER);
            }
            nodeCoords.set(node.id, { x, y, width: CARD_W, height: CARD_H, rank: layer.rank });
            if (x + CARD_W > maxX) maxX = x + CARD_W;
            if (y + CARD_H > maxY) maxY = y + CARD_H;
          });
        });

        return {
          nodeCoords,
          bounds: { width: maxX + 100, height: maxY + 100 },
          layers
        };
      }, [filteredNodes, visibleDeps, orientation]);

      // Unlink a dependency
      const handleUnlink = async (fromNodeId, toNodeId) => {
        try {
          const res = await fetch('/api/workspaces/' + workspaceId + '/dependencies', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fromNodeId, toNodeId })
          });
          if (res.ok) {
            showToast('Dependency unlinked');
            onRefreshGraph();
          } else {
            showToast('Failed to unlink dependency', 'error');
          }
        } catch {
          showToast('Failed to unlink dependency', 'error');
        }
      };

      // Zoom & Pan Handlers
      const handleZoomIn = () => setZoom(z => Math.min(2.2, +(z + 0.15).toFixed(2)));
      const handleZoomOut = () => setZoom(z => Math.max(0.35, +(z - 0.15).toFixed(2)));
      const handleResetZoom = () => {
        setZoom(1);
        setPan({ x: 50, y: 50 });
      };

      const handleFitView = () => {
        if (!canvasRef.current || dagLayout.bounds.width === 0) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const scaleX = (rect.width - 80) / dagLayout.bounds.width;
        const scaleY = (rect.height - 80) / dagLayout.bounds.height;
        const fitScale = Math.min(Math.max(0.35, Math.min(scaleX, scaleY)), 1.2);
        setZoom(+fitScale.toFixed(2));
        setPan({ x: 40, y: 40 });
      };

      // Connecting Arrow Dynamic Path (Dragging)
      const connectingPathD = useMemo(() => {
        if (!connecting) return '';
        let x1 = connecting.startX;
        let y1 = connecting.startY;
        let x2 = connecting.currentX;
        let y2 = connecting.currentY;

        // If hovering over a target node, snap to target node's input edge
        if (connecting.targetNodeId && dagLayout.nodeCoords.has(connecting.targetNodeId)) {
          const targetPos = dagLayout.nodeCoords.get(connecting.targetNodeId);
          if (orientation === 'horizontal') {
            x2 = targetPos.x;
            y2 = targetPos.y + targetPos.height / 2;
          } else {
            x2 = targetPos.x + targetPos.width / 2;
            y2 = targetPos.y;
          }
        }

        if (orientation === 'horizontal') {
          const dx = Math.max(35, Math.abs(x2 - x1) * 0.45);
          return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
        } else {
          const dy = Math.max(35, Math.abs(y2 - y1) * 0.45);
          return `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`;
        }
      }, [connecting, dagLayout.nodeCoords, orientation]);

      // Start drag-to-connect dependency from card handle
      const handleStartConnect = (e, fromNode) => {
        e.stopPropagation();
        e.preventDefault();
        const fromPos = dagLayout.nodeCoords.get(fromNode.id);
        if (!fromPos) return;

        let startX, startY;
        if (orientation === 'horizontal') {
          startX = fromPos.x + fromPos.width;
          startY = fromPos.y + fromPos.height / 2;
        } else {
          startX = fromPos.x + fromPos.width / 2;
          startY = fromPos.y + fromPos.height;
        }

        const coords = getCanvasCoordinates(e.clientX, e.clientY);
        setConnecting({
          fromNodeId: fromNode.id,
          startX,
          startY,
          currentX: coords.x,
          currentY: coords.y,
          targetNodeId: null,
          isValid: false,
          validationReason: null
        });
      };

      // Cancel connecting on Escape key
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && connecting) {
            setConnecting(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [connecting]);

      // Canvas Drag to Pan & Arrow Drawing
      const handleMouseDown = (e) => {
        // Only drag if left click on canvas background (not on cards, handles, or buttons)
        if (e.button !== 0) return;
        if (e.target.closest('.dag-node-card') || e.target.closest('.canvas-ui-control') || e.target.closest('.connection-handle')) return;
        setIsDragging(true);
        setDragStart({ x: e.clientX, y: e.clientY });
        setPanStart({ x: pan.x, y: pan.y });
      };

      const handleMouseMove = (e) => {
        if (connecting) {
          const coords = getCanvasCoordinates(e.clientX, e.clientY);
          // Detect card under mouse cursor
          const cardEl = document.elementFromPoint(e.clientX, e.clientY)?.closest('.dag-node-card');
          const targetId = cardEl ? cardEl.getAttribute('data-node-id') : null;
          const evaluation = targetId ? evaluateConnectionTarget(connecting.fromNodeId, targetId) : { isValid: false, reason: null };

          setConnecting(prev => prev ? {
            ...prev,
            currentX: coords.x,
            currentY: coords.y,
            targetNodeId: targetId,
            isValid: evaluation.isValid,
            validationReason: evaluation.reason
          } : null);
          return;
        }

        if (!isDragging) return;
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        setPan({ x: panStart.x + dx, y: panStart.y + dy });
      };

      const handleMouseUp = async () => {
        if (connecting) {
          const { fromNodeId, targetNodeId, isValid, validationReason } = connecting;
          if (targetNodeId && isValid) {
            const fromNode = nodeMap.get(fromNodeId);
            const toNode = nodeMap.get(targetNodeId);
            try {
              const res = await fetch('/api/workspaces/' + workspaceId + '/dependencies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fromNodeId, toNodeId: targetNodeId })
              });
              const data = await res.json();
              if (!res.ok) {
                showToast(data.error || 'Failed to create dependency', 'error');
              } else {
                showToast(`Dependency created: "${fromNode?.title}" ➔ "${toNode?.title}"`);
                if (onRefreshGraph) onRefreshGraph();
              }
            } catch (err) {
              showToast('Failed to create dependency', 'error');
            }
          } else if (targetNodeId && validationReason) {
            showToast(validationReason, 'error');
          }
          setConnecting(null);
          return;
        }

        setIsDragging(false);
      };

      // Mouse Wheel Zoom
      const handleWheel = (e) => {
        if (!canvasRef.current) return;
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.08 : -0.08;
        setZoom(z => Math.min(2.2, Math.max(0.35, +(z + delta).toFixed(2))));
      };

      const selectedRelation = selectedNodeId ? nodeRelations.get(selectedNodeId) : null;

      return (
        <div className="space-y-5">
          {/* Top KPI Summary Ribbon */}
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
            <div className="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-2xs">
              <div className="flex items-center justify-between text-slate-500 text-xs font-bold">
                <span>Entities</span>
                <i className="fa-solid fa-shapes text-brand-500"></i>
              </div>
              <div className="text-xl font-black text-slate-900 mt-1">{metrics.totalNodes}</div>
              <span className="text-[10px] text-slate-400">Total in workspace</span>
            </div>

            <div className="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-2xs">
              <div className="flex items-center justify-between text-slate-500 text-xs font-bold">
                <span>Dependencies</span>
                <i className="fa-solid fa-network-wired text-purple-500"></i>
              </div>
              <div className="text-xl font-black text-purple-700 mt-1">{metrics.dependencyEdges}</div>
              <span className="text-[10px] text-slate-400">Prerequisite edges</span>
            </div>

            <div className="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-2xs">
              <div className="flex items-center justify-between text-slate-500 text-xs font-bold">
                <span>Cross-Goal</span>
                <i className="fa-solid fa-arrows-split-up-and-left text-amber-500"></i>
              </div>
              <div className="text-xl font-black text-amber-600 mt-1">{metrics.crossGoalCount}</div>
              <span className="text-[10px] text-slate-400">Inter-goal handoffs</span>
            </div>

            <div className="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-2xs">
              <div className="flex items-center justify-between text-slate-500 text-xs font-bold">
                <span>Blocked</span>
                <i className="fa-solid fa-lock text-rose-500"></i>
              </div>
              <div className="text-xl font-black text-rose-600 mt-1">{metrics.blockedNodes}</div>
              <span className="text-[10px] text-slate-400">Waiting on uncompleted tasks</span>
            </div>

            <div className="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-2xs col-span-2 sm:col-span-1">
              <div className="flex items-center justify-between text-slate-500 text-xs font-bold">
                <span>Key Bottleneck</span>
                <i className="fa-solid fa-bolt text-amber-500"></i>
              </div>
              <div className="text-xs font-bold text-slate-900 mt-1 truncate" title={metrics.topBottleneck ? metrics.topBottleneck.title : 'None'}>
                {metrics.topBottleneck ? metrics.topBottleneck.title : 'None'}
              </div>
              <span className="text-[10px] text-slate-400">
                {metrics.maxUnblocks > 0 ? 'Unblocks ' + metrics.maxUnblocks + ' downstream' : 'No blocker edges'}
              </span>
            </div>
          </div>

          {/* Primary View Switcher & Action Bar */}
          <div className="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xs flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 text-xs">
            {/* View Mode Tabs */}
            <div className="inline-flex bg-slate-100 p-1 rounded-xl font-bold shadow-inner flex-shrink-0">
              <button
                onClick={() => setViewMode('canvas')}
                className={'px-3.5 py-1.5 rounded-lg flex items-center space-x-1.5 transition ' + (
                  viewMode === 'canvas' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                )}
              >
                <i className="fa-solid fa-bezier-curve text-brand-600"></i>
                <span>Miro Canvas</span>
              </button>
              <button
                onClick={() => setViewMode('matrix')}
                className={'px-3.5 py-1.5 rounded-lg flex items-center space-x-1.5 transition ' + (
                  viewMode === 'matrix' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                )}
              >
                <i className="fa-solid fa-table-cells text-purple-600"></i>
                <span>Dependency Matrix</span>
              </button>
              <button
                onClick={() => setViewMode('cards')}
                className={'px-3.5 py-1.5 rounded-lg flex items-center space-x-1.5 transition ' + (
                  viewMode === 'cards' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                )}
              >
                <i className="fa-solid fa-list-check text-emerald-600"></i>
                <span>Detail Cards</span>
              </button>
            </div>

            {/* Global Actions */}
            <div className="flex items-center space-x-2 justify-end">
              <button
                onClick={() => setAddDepModal({ isOpen: true, fromId: '', toId: '' })}
                className="px-3.5 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold flex items-center space-x-1.5 shadow-sm transition"
              >
                <i className="fa-solid fa-plus text-[10px]"></i>
                <span>Add Dependency</span>
              </button>
            </div>
          </div>

          {/* Scope Filters Panel (Miro & Cards Mode) */}
          <div className="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xs space-y-3 text-xs">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2.5">
                {/* Goal Scope Dropdown */}
                <div className="flex items-center space-x-1.5">
                  <span className="font-bold text-slate-500 uppercase text-[10px] tracking-wider">Scope:</span>
                  <select
                    value={goalScope}
                    onChange={(e) => setGoalScope(e.target.value)}
                    className="bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-xl font-semibold text-slate-800 outline-none cursor-pointer focus:ring-2 focus:ring-brand-500"
                  >
                    <option value="all">All Goals ({rootGoals.length})</option>
                    <option value="cross_goal_only">⚡ Cross-Goal Blockers Only ({metrics.crossGoalCount})</option>
                    {rootGoals.map(g => (
                      <option key={g.id} value={g.id}>Goal: {g.title}</option>
                    ))}
                  </select>
                </div>

                {/* Only Connected Nodes Checkbox */}
                <label className="inline-flex items-center space-x-1.5 font-semibold text-slate-700 cursor-pointer select-none bg-slate-50 hover:bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200 transition">
                  <input
                    type="checkbox"
                    checked={connectedOnly}
                    onChange={(e) => setConnectedOnly(e.target.checked)}
                    className="rounded text-brand-600 focus:ring-brand-500 text-xs"
                  />
                  <span>Connected Only</span>
                  <span className="text-[10px] text-slate-400 font-mono">({connectedNodeIds.size})</span>
                </label>

                {/* Toggle Done Nodes */}
                <button
                  onClick={() => setIncludeDone(!includeDone)}
                  className={'px-2.5 py-1 rounded-xl border font-semibold transition flex items-center space-x-1.5 ' + (
                    includeDone
                      ? 'bg-emerald-50 border-emerald-300 text-emerald-800'
                      : 'bg-white border-slate-200 text-slate-400 hover:bg-slate-50'
                  )}
                  title={includeDone ? 'Click to hide completed (Done) nodes' : 'Click to show completed (Done) nodes'}
                >
                  <i className={'fa-solid ' + (includeDone ? 'fa-circle-check text-emerald-600' : 'fa-circle-notch text-slate-300') + ' text-[10px]'}></i>
                  <span>Done Nodes</span>
                  <span className="font-mono text-[10px] opacity-75">({metrics.doneNodes})</span>
                </button>

                {/* Readiness Filter */}
                <div className="flex items-center space-x-1">
                  {[
                    { id: 'all', label: 'All' },
                    { id: 'blocked', label: 'Blocked', icon: 'fa-lock' },
                    { id: 'ready', label: 'Ready', icon: 'fa-check' },
                    { id: 'in_progress', label: 'Active', icon: 'fa-bolt' },
                    { id: 'done', label: 'Done Only', icon: 'fa-check-double' }
                  ].map(st => (
                    <button
                      key={st.id}
                      onClick={() => setFilterStatus(st.id)}
                      className={'px-2 py-0.5 rounded-lg font-semibold transition flex items-center space-x-1 ' + (
                        filterStatus === st.id
                          ? (st.id === 'blocked' ? 'bg-rose-600 text-white' : st.id === 'ready' ? 'bg-emerald-600 text-white' : st.id === 'done' ? 'bg-emerald-700 text-white' : 'bg-slate-900 text-white')
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      )}
                    >
                      {st.icon && <i className={'fa-solid ' + st.icon + ' text-[9px]'}></i>}
                      <span>{st.label}</span>
                    </button>
                  ))}
                </div>

                {/* Entity Type Filter */}
                <div className="flex items-center space-x-1">
                  {['all', 'goal', 'milestone', 'action'].map(t => (
                    <button
                      key={t}
                      onClick={() => setFilterType(t)}
                      className={'px-2 py-0.5 rounded-lg font-semibold capitalize transition ' + (
                        filterType === t ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      )}
                    >
                      {t}
                    </button>
                  ))}
                </div>
              </div>

              {/* Real-time Search Box */}
              <div className="relative w-full sm:w-56">
                <i className="fa-solid fa-magnifying-glass absolute left-3 top-2 text-slate-400 text-xs"></i>
                <input
                  type="text"
                  placeholder="Filter nodes by title..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-8 pr-3 py-1 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-1.5 text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-xs"></i>
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* Sub-view 1: Interactive Miro-Style Dependency Canvas */}
          {viewMode === 'canvas' && (
            <div className="relative bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden flex flex-col">
              {/* Canvas Header & Orientation Switcher */}
              <div className="px-5 py-3 border-b border-slate-100 bg-white flex flex-wrap items-center justify-between gap-3 text-xs z-10">
                <div className="flex items-center space-x-3">
                  <span className="font-bold text-slate-900 flex items-center space-x-1.5">
                    <i className="fa-solid fa-diagram-project text-brand-600"></i>
                    <span>Directed Execution Flow</span>
                  </span>
                  <span className="text-[11px] text-slate-400">
                    Showing {filteredNodes.length} of {nodes.length} nodes • {visibleDeps.length} edges
                    {!includeDone && metrics.doneNodes > 0 && (
                      <span className="text-emerald-700 font-medium ml-1.5">({metrics.doneNodes} completed hidden)</span>
                    )}
                  </span>
                </div>

                {/* Horizontal vs Vertical Orientation Mode Switcher */}
                <div className="flex items-center space-x-2">
                  <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Flow Mode:</span>
                  <div className="inline-flex bg-slate-100 p-0.5 rounded-xl font-bold">
                    <button
                      onClick={() => setOrientation('horizontal')}
                      className={'px-3 py-1 rounded-lg flex items-center space-x-1.5 transition ' + (
                        orientation === 'horizontal' ? 'bg-white text-brand-700 shadow-2xs' : 'text-slate-500 hover:text-slate-900'
                      )}
                      title="Left-to-Right Causal Pipeline (Prerequisites ➔ Next ➔ Deliverables)"
                    >
                      <i className="fa-solid fa-arrow-right-long text-xs"></i>
                      <span>Horizontal (Pipeline)</span>
                    </button>
                    <button
                      onClick={() => setOrientation('vertical')}
                      className={'px-3 py-1 rounded-lg flex items-center space-x-1.5 transition ' + (
                        orientation === 'vertical' ? 'bg-white text-brand-700 shadow-2xs' : 'text-slate-500 hover:text-slate-900'
                      )}
                      title="Top-to-Bottom Breakdown (Goals ➔ Milestones ➔ Actions)"
                    >
                      <i className="fa-solid fa-arrow-down-long text-xs"></i>
                      <span>Vertical (Hierarchy)</span>
                    </button>
                  </div>
                </div>
              </div>

              {/* The Whiteboard Canvas Area */}
              <div
                ref={canvasRef}
                onMouseDown={handleMouseDown}
                onMouseMove={handleMouseMove}
                onMouseUp={handleMouseUp}
                onMouseLeave={handleMouseUp}
                onWheel={handleWheel}
                className={'relative w-full h-[640px] overflow-hidden select-none ' + (
                  isDragging ? 'cursor-grabbing' : connecting ? 'cursor-crosshair' : 'cursor-grab'
                )}
                style={{
                  backgroundColor: '#f8fafc',
                  backgroundImage: 'radial-gradient(circle, #cbd5e1 1.2px, transparent 1.2px)',
                  backgroundSize: '24px 24px'
                }}
              >
                {/* Dragging Dependency Status Overlay */}
                {connecting && (
                  <div className="canvas-ui-control absolute top-4 left-1/2 -translate-x-1/2 z-40 bg-slate-900/90 backdrop-blur-sm text-white px-4 py-2 rounded-2xl shadow-xl flex items-center space-x-3 text-xs border border-slate-700 pointer-events-none">
                    <div className={`w-2.5 h-2.5 rounded-full ${
                      connecting.targetNodeId
                        ? (connecting.isValid ? 'bg-emerald-400 animate-ping' : 'bg-rose-500')
                        : 'bg-brand-400 animate-pulse'
                    }`} />
                    <span className="font-semibold">
                      {connecting.targetNodeId ? (
                        connecting.isValid ? (
                          <span>Drop to link: <strong>{nodeMap.get(connecting.fromNodeId)?.title}</strong> ➔ <strong>{nodeMap.get(connecting.targetNodeId)?.title}</strong></span>
                        ) : (
                          <span className="text-rose-300 font-bold">{connecting.validationReason}</span>
                        )
                      ) : (
                        <span>Drag arrow to dependent task • Press <strong>Esc</strong> to cancel</span>
                      )}
                    </span>
                  </div>
                )}
                {/* Empty State */}
                {filteredNodes.length === 0 && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none p-6 text-center">
                    <div className="w-12 h-12 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400 mb-3">
                      <i className="fa-solid fa-filter-circle-xmark text-xl"></i>
                    </div>
                    <p className="font-bold text-slate-800 text-sm">No Nodes Match Current Filter</p>
                    <p className="text-xs text-slate-500 mt-1 max-w-sm">
                      Try unchecking "Connected Only" or clearing the search query to reveal all workspace entities.
                    </p>
                    <button
                      onClick={() => {
                        setGoalScope('all');
                        setConnectedOnly(false);
                        setIncludeDone(true);
                        setFilterStatus('all');
                        setFilterType('all');
                        setSearchQuery('');
                      }}
                      className="mt-4 px-3.5 py-1.5 bg-white border border-slate-300 rounded-xl text-xs font-semibold text-slate-700 pointer-events-auto hover:bg-slate-50"
                    >
                      Reset All Filters
                    </button>
                  </div>
                )}

                {/* Transformed Miro Graph Plane (Pan & Zoom) */}
                <div
                  className="absolute origin-top-left transition-transform duration-75 ease-out"
                  style={{
                    transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
                    width: dagLayout.bounds.width,
                    height: dagLayout.bounds.height
                  }}
                >
                  {/* SVG Connector Layer */}
                  <svg
                    className="absolute inset-0 pointer-events-none"
                    style={{ width: dagLayout.bounds.width, height: dagLayout.bounds.height }}
                  >
                    <defs>
                      <marker id="arrow-emerald" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                        <polygon points="0 0, 7 3, 0 6" fill="#10b981" />
                      </marker>
                      <marker id="arrow-rose" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                        <polygon points="0 0, 7 3, 0 6" fill="#f43f5e" />
                      </marker>
                      <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
                        <polygon points="0 0, 8 3.5, 0 7" fill="#6366f1" />
                      </marker>
                      <marker id="arrow-dimmed" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
                        <polygon points="0 0, 6 2.5, 0 5" fill="#cbd5e1" />
                      </marker>
                      <marker id="arrow-connecting-valid" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
                        <polygon points="0 0, 8 3.5, 0 7" fill="#10b981" />
                      </marker>
                      <marker id="arrow-connecting-invalid" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
                        <polygon points="0 0, 8 3.5, 0 7" fill="#f43f5e" />
                      </marker>
                      <marker id="arrow-connecting-neutral" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
                        <polygon points="0 0, 8 3.5, 0 7" fill="#6366f1" />
                      </marker>
                    </defs>

                    {visibleDeps.map((dep, depIdx) => {
                      const fromPos = dagLayout.nodeCoords.get(dep.fromNodeId);
                      const toPos = dagLayout.nodeCoords.get(dep.toNodeId);
                      if (!fromPos || !toPos) return null;

                      const fromNode = nodeMap.get(dep.fromNodeId);
                      const isSatisfied = fromNode?.status === 'done';
                      const edgeKey = dep.fromNodeId + '->' + dep.toNodeId;

                      const isEdgeActive = activeHighlightSet && activeHighlightSet.activeEdges.has(edgeKey);
                      const isDimmed = activeHighlightSet && !isEdgeActive;

                      let x1, y1, x2, y2, d;
                      if (orientation === 'horizontal') {
                        x1 = fromPos.x + fromPos.width;
                        y1 = fromPos.y + fromPos.height / 2;
                        x2 = toPos.x;
                        y2 = toPos.y + toPos.height / 2;
                        const dx = Math.max(35, Math.abs(x2 - x1) * 0.45);
                        d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
                      } else {
                        x1 = fromPos.x + fromPos.width / 2;
                        y1 = fromPos.y + fromPos.height;
                        x2 = toPos.x + toPos.width / 2;
                        y2 = toPos.y;
                        const dy = Math.max(35, Math.abs(y2 - y1) * 0.45);
                        d = `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`;
                      }

                      const strokeColor = isEdgeActive
                        ? '#6366f1'
                        : isSatisfied
                        ? '#10b981'
                        : '#f43f5e';

                      const markerEnd = isEdgeActive
                        ? 'url(#arrow-indigo)'
                        : isDimmed
                        ? 'url(#arrow-dimmed)'
                        : isSatisfied
                        ? 'url(#arrow-emerald)'
                        : 'url(#arrow-rose)';

                      return (
                        <g key={depIdx} className="transition-opacity duration-150" opacity={isDimmed ? 0.2 : 1}>
                          {/* Wide invisible path for easy hover/clicking */}
                          <path
                            d={d}
                            fill="none"
                            stroke="transparent"
                            strokeWidth="14"
                            className="pointer-events-auto cursor-pointer"
                            onMouseEnter={() => setHoveredEdge(dep)}
                            onMouseLeave={() => setHoveredEdge(null)}
                            onClick={() => handleUnlink(dep.fromNodeId, dep.toNodeId)}
                          />
                          {/* Visual Bezier Path */}
                          <path
                            d={d}
                            fill="none"
                            stroke={isDimmed ? '#cbd5e1' : strokeColor}
                            strokeWidth={isEdgeActive ? 3.5 : 2}
                            strokeDasharray={!isSatisfied && !isEdgeActive ? '5 4' : 'none'}
                            markerEnd={markerEnd}
                          />
                        </g>
                      );
                    })}

                    {/* Live interactive connecting arrow while dragging */}
                    {connecting && connectingPathD && (
                      <g className="pointer-events-none">
                        {/* Glow halo */}
                        <path
                          d={connectingPathD}
                          fill="none"
                          stroke={connecting.targetNodeId ? (connecting.isValid ? '#10b981' : '#f43f5e') : '#6366f1'}
                          strokeWidth="8"
                          strokeOpacity="0.25"
                        />
                        {/* Core animated dashed Bézier path */}
                        <path
                          d={connectingPathD}
                          fill="none"
                          stroke={connecting.targetNodeId ? (connecting.isValid ? '#10b981' : '#f43f5e') : '#6366f1'}
                          strokeWidth="3.5"
                          strokeDasharray="6 4"
                          className="animate-pulse"
                          markerEnd={
                            connecting.targetNodeId
                              ? (connecting.isValid ? 'url(#arrow-connecting-valid)' : 'url(#arrow-connecting-invalid)')
                              : 'url(#arrow-connecting-neutral)'
                          }
                        />
                      </g>
                    )}
                  </svg>

                  {/* HTML Node Cards Layer */}
                  {filteredNodes.map(node => {
                    const pos = dagLayout.nodeCoords.get(node.id);
                    if (!pos) return null;

                    const rootG = nodeGoalMap.get(node.id);
                    const palette = rootG && goalColorMap ? (goalColorMap.get(rootG.id) || GOAL_COLOR_PALETTES[0]) : GOAL_COLOR_PALETTES[0];
                    const rel = nodeRelations.get(node.id);
                    const isBlocked = rel?.readinessInfo?.readiness === 'blocked';
                    const isDone = node.status === 'done';
                    const isInProgress = node.status === 'in_progress';

                    // Causal highlight states
                    const isSelected = selectedNodeId === node.id;
                    const isUpstream = activeHighlightSet && activeHighlightSet.upstream.has(node.id);
                    const isDownstream = activeHighlightSet && activeHighlightSet.downstream.has(node.id);
                    const isDimmed = activeHighlightSet && !isSelected && !isUpstream && !isDownstream;

                    const prereqCount = rel?.prerequisites?.length || 0;
                    const depCount = rel?.dependents?.length || 0;

                    // Connecting state for this node
                    const isConnectingSource = connecting && connecting.fromNodeId === node.id;
                    const isConnectingTarget = connecting && connecting.targetNodeId === node.id;
                    const isValidTarget = isConnectingTarget && connecting.isValid;
                    const isInvalidTarget = isConnectingTarget && !connecting.isValid;
                    const canBeDependency = node.type !== 'goal';

                    return (
                      <div
                        key={node.id}
                        data-node-id={node.id}
                        onClick={() => setSelectedNodeId(isSelected ? null : node.id)}
                        onMouseEnter={() => setHoveredNodeId(node.id)}
                        onMouseLeave={() => setHoveredNodeId(null)}
                        className={'dag-node-card group/card absolute rounded-xl bg-white border cursor-pointer transition-all duration-150 flex flex-col justify-between ' + (
                          isConnectingSource
                            ? 'ring-2 ring-brand-500 border-brand-500 shadow-xl scale-[1.02] z-30'
                            : isValidTarget
                            ? 'ring-4 ring-emerald-500 border-emerald-500 shadow-2xl scale-[1.03] z-40 bg-emerald-50/30'
                            : isInvalidTarget
                            ? 'ring-4 ring-rose-500 border-rose-500 shadow-2xl scale-[1.03] z-40 bg-rose-50/30'
                            : isSelected
                            ? 'ring-2 ring-brand-500 border-brand-500 shadow-lg scale-[1.02] z-30'
                            : isUpstream
                            ? 'ring-2 ring-cyan-400 border-cyan-400 shadow-md z-20'
                            : isDownstream
                            ? 'ring-2 ring-amber-400 border-amber-400 shadow-md z-20'
                            : 'border-slate-200 hover:border-slate-400 hover:shadow-md z-10'
                        )}
                        style={{
                          transform: `translate(${pos.x}px, ${pos.y}px)`,
                          width: `${pos.width}px`,
                          height: `${pos.height}px`,
                          opacity: isDimmed ? 0.35 : 1
                        }}
                      >
                        {/* Top Goal Color Stripe */}
                        <div
                          className="h-1.5 w-full rounded-t-xl"
                          style={{ backgroundColor: palette.border }}
                        />

                        {/* Input Target Anchor Indicator during connecting mode */}
                        {connecting && connecting.fromNodeId !== node.id && canBeDependency && (
                          <div
                            className={'absolute z-30 pointer-events-none transition-all duration-150 flex items-center justify-center ' + (
                              orientation === 'horizontal'
                                ? '-left-2.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full '
                                : 'left-1/2 -top-2.5 -translate-x-1/2 w-5 h-5 rounded-full '
                            ) + (
                              isValidTarget
                                ? 'bg-emerald-500 text-white scale-125 ring-4 ring-emerald-200 shadow-md'
                                : isInvalidTarget
                                ? 'bg-rose-500 text-white scale-125 ring-4 ring-rose-200 shadow-md'
                                : 'bg-slate-300 text-slate-600 border border-slate-400'
                            )}
                          >
                            <div className="w-1.5 h-1.5 rounded-full bg-current"></div>
                          </div>
                        )}

                        {/* Output Connector Drag Handle (Link as prerequisite) */}
                        {canBeDependency && (
                          <div
                            onMouseDown={(e) => handleStartConnect(e, node)}
                            title="Drag arrow to link as prerequisite for another task"
                            className={'connection-handle absolute z-30 flex items-center justify-center cursor-crosshair transition-all duration-150 ' + (
                              orientation === 'horizontal'
                                ? '-right-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-white border-2 border-brand-500 text-brand-600 shadow-sm hover:scale-125 hover:bg-brand-500 hover:text-white '
                                : 'left-1/2 -bottom-3 -translate-x-1/2 w-6 h-6 rounded-full bg-white border-2 border-brand-500 text-brand-600 shadow-sm hover:scale-125 hover:bg-brand-500 hover:text-white '
                            ) + (
                              isConnectingSource ? 'scale-125 bg-brand-500 text-white shadow-md' : 'opacity-0 group-hover/card:opacity-100'
                            )}
                          >
                            <i className={`fa-solid ${orientation === 'horizontal' ? 'fa-arrow-right' : 'fa-arrow-down'} text-[10px]`}></i>
                          </div>
                        )}

                        {/* Card Content */}
                        <div className="p-2.5 flex-1 flex flex-col justify-between overflow-hidden">
                          {/* Top Line: Goal Pill + Type Tag */}
                          <div className="flex items-center justify-between text-[9px] gap-1">
                            {rootG ? (
                              <span
                                className="px-1.5 py-0.2 rounded font-black uppercase truncate max-w-[120px]"
                                style={{
                                  backgroundColor: palette.badgeBg,
                                  color: palette.badgeText
                                }}
                                title={'Goal: ' + rootG.title}
                              >
                                {rootG.title}
                              </span>
                            ) : (
                              <span className="text-slate-400 uppercase font-mono">General</span>
                            )}

                            <span className="text-[9px] uppercase font-mono text-slate-400 flex-shrink-0">
                              [{node.type.slice(0, 3)}]
                            </span>
                          </div>

                          {/* Title */}
                          <p
                            className={'text-xs font-bold leading-snug line-clamp-2 my-1 ' + (
                              isDone ? 'line-through text-slate-400' : 'text-slate-900'
                            )}
                            title={node.title}
                          >
                            {node.title}
                          </p>

                          {/* Card Footer: Status Pill & Dependency Counters */}
                          <div className="flex items-center justify-between pt-1 border-t border-slate-100 text-[9px]">
                            {/* Status indicator */}
                            <div className="flex items-center space-x-1">
                              {isBlocked ? (
                                <span className="px-1.5 py-0.2 rounded font-black uppercase bg-rose-100 text-rose-800 flex items-center space-x-1">
                                  <i className="fa-solid fa-lock text-[8px]"></i>
                                  <span>Blocked</span>
                                </span>
                              ) : isDone ? (
                                <span className="px-1.5 py-0.2 rounded font-bold uppercase bg-emerald-100 text-emerald-800">
                                  ✓ Done
                                </span>
                              ) : isInProgress ? (
                                <span className="px-1.5 py-0.2 rounded font-bold uppercase bg-amber-100 text-amber-800">
                                  ⚡ Active
                                </span>
                              ) : (
                                <span className="px-1.5 py-0.2 rounded font-bold uppercase bg-slate-100 text-slate-600">
                                  Ready
                                </span>
                              )}
                            </div>

                            {/* Prerequisite & Dependent Badges */}
                            <div className="flex items-center space-x-1 text-slate-400 font-mono font-bold">
                              {prereqCount > 0 && (
                                <span
                                  className="px-1 rounded bg-slate-100 text-slate-600"
                                  title={`${prereqCount} Prerequisite tasks required before starting`}
                                >
                                  ↳{prereqCount}
                                </span>
                              )}
                              {depCount > 0 && (
                                <span
                                  className="px-1 rounded bg-purple-50 text-purple-700"
                                  title={`Unlocks ${depCount} downstream tasks`}
                                >
                                  ➔{depCount}
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Floating Miro Canvas Controls (Bottom-Left) */}
                <div className="canvas-ui-control absolute bottom-4 left-4 z-30 bg-white/95 backdrop-blur-sm border border-slate-200 rounded-2xl shadow-md p-1.5 flex items-center space-x-1 text-xs">
                  <button
                    onClick={handleZoomIn}
                    className="w-7 h-7 rounded-xl hover:bg-slate-100 text-slate-700 flex items-center justify-center transition"
                    title="Zoom In"
                  >
                    <i className="fa-solid fa-plus text-xs"></i>
                  </button>
                  <button
                    onClick={handleZoomOut}
                    className="w-7 h-7 rounded-xl hover:bg-slate-100 text-slate-700 flex items-center justify-center transition"
                    title="Zoom Out"
                  >
                    <i className="fa-solid fa-minus text-xs"></i>
                  </button>
                  <button
                    onClick={handleResetZoom}
                    className="px-2 h-7 rounded-xl hover:bg-slate-100 text-slate-700 font-mono text-[11px] font-bold transition"
                    title="Reset Zoom to 100%"
                  >
                    {Math.round(zoom * 100)}%
                  </button>
                  <div className="w-[1px] h-4 bg-slate-200"></div>
                  <button
                    onClick={handleFitView}
                    className="px-2 h-7 rounded-xl hover:bg-slate-100 text-slate-700 text-xs font-semibold flex items-center space-x-1 transition"
                    title="Fit Content to Screen"
                  >
                    <i className="fa-solid fa-expand text-[10px]"></i>
                    <span>Fit</span>
                  </button>
                </div>

                {/* Floating Canvas Legend & Tips (Bottom-Right) */}
                <div className="canvas-ui-control absolute bottom-4 right-4 z-30 hidden sm:flex items-center space-x-3 bg-white/90 backdrop-blur-sm border border-slate-200 rounded-2xl px-3 py-1.5 shadow-md text-[11px] text-slate-500">
                  <span className="flex items-center space-x-1">
                    <span className="w-2.5 h-0.5 bg-rose-500 inline-block"></span>
                    <span>Blocking Prerequisite</span>
                  </span>
                  <span className="flex items-center space-x-1">
                    <span className="w-2.5 h-0.5 bg-emerald-500 inline-block"></span>
                    <span>Satisfied Edge</span>
                  </span>
                  <span className="text-slate-300">•</span>
                  <span className="flex items-center space-x-1 text-brand-600 font-semibold">
                    <i className="fa-solid fa-arrow-right text-[10px]"></i>
                    <span>Drag handle to link tasks</span>
                  </span>

    // --- High-Density, Paper-Efficient Printable Todo List Page ---
    function PrintableTodoPage({ graphData, workspaceName, onBack, onToggleStatus, showToast }) {
      const [orderMode, setOrderMode] = useState('topological'); // 'topological' | 'hierarchical'
      const [density, setDensity] = useState('compact'); // 'compact' (paper-saving) | 'comfortable'
      const [filterCompleted, setFilterCompleted] = useState(false); // false: pending only, true: include completed
      const [selectedGoalId, setSelectedGoalId] = useState('all'); // 'all' or specific goal id
      const [includeNotes, setIncludeNotes] = useState(true); // Option to include notes!
      const [includeHandwritingLines, setIncludeHandwritingLines] = useState(false);
      const [includeBlocked, setIncludeBlocked] = useState(true); // Toggle for Subsequent Horizon (Waiting on Prerequisites)
      const [typeFilter, setTypeFilter] = useState('all'); // 'all' | 'actions'

      const nodes = useMemo(() => (graphData.nodes || []).filter(n => !n.archivedAt), [graphData.nodes]);
      const activeNodeIds = useMemo(() => new Set(nodes.map(n => n.id)), [nodes]);
      const dependencies = useMemo(() => (graphData.dependencies || []).filter(d => activeNodeIds.has(d.fromNodeId) && activeNodeIds.has(d.toNodeId)), [graphData.dependencies, activeNodeIds]);
      const readinessMap = graphData.readiness || {};

      const nodeMap = useMemo(() => {
        const m = new Map();
        nodes.forEach(n => m.set(n.id, n));
        return m;
      }, [nodes]);

      // All root goals & assigned colors
      const rootGoals = useMemo(() => {
        return nodes.filter(n => n.type === 'goal');
      }, [nodes]);

      const goalColorMap = useMemo(() => {
        const m = new Map();
        rootGoals.forEach((g, idx) => {
          m.set(g.id, GOAL_COLOR_PALETTES[idx % GOAL_COLOR_PALETTES.length]);
        });
        return m;
      }, [rootGoals]);

      // Filter actionable items
      const actionableNodes = useMemo(() => {
        return nodes.filter(n => {
          if (typeFilter === 'actions' && n.type !== 'action' && n.type !== 'sub_action') return false;
          if (typeFilter === 'all' && (n.type === 'goal' || n.type === 'sub_goal')) return false; // Focuses on executable tasks & milestones
          if (!filterCompleted && n.status === 'done') return false;

          // Filter by Goal if chosen
          if (selectedGoalId !== 'all') {
            const rootG = findNodeRootGoal(n.id, nodes);
            if (!rootG || rootG.id !== selectedGoalId) return false;
          }
          return true;
        });
      }, [nodes, typeFilter, filterCompleted, selectedGoalId]);

      // Topological sort of actionable nodes
      const topologicallySortedNodes = useMemo(() => {
        return computeTopologicalOrder(actionableNodes, dependencies);
      }, [actionableNodes, dependencies]);

      // Group into Topological Execution buckets
      const executionBuckets = useMemo(() => {
        const readyItems = [];
        const inProgressItems = [];
        const blockedItems = [];
        const doneItems = [];

        topologicallySortedNodes.forEach(node => {
          const isBlocked = readinessMap[node.id]?.readiness === 'blocked';
          if (node.status === 'done') {
            doneItems.push(node);
          } else if (node.status === 'in_progress') {
            inProgressItems.push(node);
          } else if (isBlocked) {
            blockedItems.push(node);
          } else {
            readyItems.push(node);
          }
        });

        return {
          readyItems,
          inProgressItems,
          blockedItems,
          doneItems,
        };
      }, [topologicallySortedNodes, readinessMap]);

      // Hierarchical grouping by Goal -> Milestone -> Actions
      const hierarchicalGroups = useMemo(() => {
        const targetGoals = selectedGoalId === 'all' ? rootGoals : rootGoals.filter(g => g.id === selectedGoalId);
        const groups = [];

        targetGoals.forEach(goal => {
          const descendants = getDescendantNodes(goal.id, nodes);
          const milestones = descendants.filter(n => n.type === 'milestone');
          const actions = descendants.filter(n => n.type === 'action' || n.type === 'sub_action');

          const activeActions = filterCompleted ? actions : actions.filter(a => a.status !== 'done');
          const finalActions = includeBlocked ? activeActions : activeActions.filter(a => readinessMap[a.id]?.readiness !== 'blocked');
          const activeMilestones = filterCompleted ? milestones : milestones.filter(m => m.status !== 'done');
          const finalMilestones = includeBlocked ? activeMilestones : activeMilestones.filter(m => readinessMap[m.id]?.readiness !== 'blocked');

          if (finalActions.length > 0 || finalMilestones.length > 0) {
            groups.push({
              goal,
              palette: goalColorMap.get(goal.id) || GOAL_COLOR_PALETTES[0],
              milestones: finalMilestones,
              actions: computeTopologicalOrder(finalActions, dependencies)
            });
          }
        });

        return groups;
      }, [rootGoals, selectedGoalId, nodes, filterCompleted, includeBlocked, dependencies, goalColorMap, readinessMap]);

      const totalActiveTasks = nodes.filter(n => n.type === 'action' || n.type === 'sub_action' || n.type === 'milestone').length;
      const completedTasks = nodes.filter(n => (n.type === 'action' || n.type === 'sub_action' || n.type === 'milestone') && n.status === 'done').length;
      const progressPercent = totalActiveTasks > 0 ? Math.round((completedTasks / totalActiveTasks) * 100) : 0;

      const printDateStr = new Date().toLocaleDateString(undefined, {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });

      const isCompact = density === 'compact';

      return (
        <div className="space-y-4">
          {/* Screen Controls Toolbar (STRICTLY HIDDEN IN PRINT VIA no-print) */}
          <div className="no-print bg-white border border-slate-200 rounded-2xl shadow-sm p-3.5 sm:p-4 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-3 text-xs">
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={onBack}
                className="px-3 py-1.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold flex items-center space-x-1.5 transition"
              >
                <i className="fa-solid fa-arrow-left"></i>
                <span>Back</span>
              </button>

              {/* Order Mode Switcher */}
              <div className="inline-flex bg-slate-100 p-0.5 rounded-xl font-bold">
                <button
                  onClick={() => setOrderMode('topological')}
                  className={'px-2.5 py-1 rounded-lg transition ' + (orderMode === 'topological' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-900')}
                >
                  Execution Order
                </button>
                <button
                  onClick={() => setOrderMode('hierarchical')}
                  className={'px-2.5 py-1 rounded-lg transition ' + (orderMode === 'hierarchical' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-900')}
                >
                  By Goal
                </button>
              </div>

              {/* Density Toggle (Compact vs Comfortable) */}
              <div className="inline-flex bg-slate-100 p-0.5 rounded-xl font-bold">
                <button
                  onClick={() => setDensity('compact')}
                  className={'px-2.5 py-1 rounded-lg transition flex items-center space-x-1 ' + (density === 'compact' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-500 hover:text-slate-900')}
                  title="Save vertical space & paper"
                >
                  <i className="fa-solid fa-compress text-[10px]"></i>
                  <span>Compact (Save Paper)</span>
                </button>
                <button
                  onClick={() => setDensity('comfortable')}
                  className={'px-2.5 py-1 rounded-lg transition ' + (density === 'comfortable' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-900')}
                >
                  Comfortable
                </button>
              </div>

              {/* Goal Filter Selector */}
              {rootGoals.length > 1 && (
                <select
                  value={selectedGoalId}
                  onChange={(e) => setSelectedGoalId(e.target.value)}
                  className="bg-slate-50 border border-slate-200 px-2 py-1 rounded-xl font-semibold text-slate-700 outline-none cursor-pointer text-xs"
                >
                  <option value="all">All Goals ({rootGoals.length})</option>
                  {rootGoals.map(g => (
                    <option key={g.id} value={g.id}>Goal: {g.title}</option>
                  ))}
                </select>
              )}

              {/* Filter Completed */}
              <button
                onClick={() => setFilterCompleted(!filterCompleted)}
                className={'px-2.5 py-1 rounded-xl border font-semibold transition ' + (
                  filterCompleted ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                )}
              >
                {filterCompleted ? 'All Tasks' : 'Incomplete Only'}
              </button>

              {/* Toggle Subsequent Horizon (Waiting on Prerequisites) */}
              <button
                onClick={() => setIncludeBlocked(!includeBlocked)}
                className={'px-2.5 py-1 rounded-xl border font-semibold transition flex items-center space-x-1.5 ' + (
                  includeBlocked
                    ? 'bg-rose-50 border-rose-300 text-rose-800'
                    : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'
                )}
                title={includeBlocked ? 'Click to hide Subsequent Horizon (blocked tasks) to save paper and vertical space' : 'Click to show Subsequent Horizon'}
              >
                <i className={'fa-solid ' + (includeBlocked ? 'fa-lock' : 'fa-lock-open') + ' text-[10px]'}></i>
                <span>Subsequent Horizon</span>
                <span className="font-mono text-[10px] opacity-75">({executionBuckets.blockedItems.length})</span>
              </button>
            </div>

            <div className="flex flex-wrap items-center gap-2.5 w-full lg:w-auto justify-end">
              {/* Option to include notes checkbox */}
              <label className="inline-flex items-center space-x-1.5 font-semibold text-slate-700 cursor-pointer select-none bg-amber-50/80 px-2 py-1 rounded-lg border border-amber-200">
                <input
                  type="checkbox"
                  checked={includeNotes}
                  onChange={(e) => setIncludeNotes(e.target.checked)}
                  className="rounded text-amber-600 focus:ring-amber-500 text-xs"
                />
                <span>Include Notes</span>
              </label>

              {/* Option for handwritten note lines */}
              <label className="inline-flex items-center space-x-1.5 font-semibold text-slate-700 cursor-pointer select-none bg-slate-50 px-2 py-1 rounded-lg border border-slate-200">
                <input

    // High-Density Compact Checklist Task Row
    function PrintTaskRow({ node, allNodes, nodeMap, readinessMap, goalColorMap, includeNotes, includeHandwritingLines, isCompact, onToggleStatus }) {
      const isDone = node.status === 'done';
      const isBlocked = readinessMap[node.id]?.readiness === 'blocked';
      const blockerTitles = readinessMap[node.id]?.blockingNodeTitles || (readinessMap[node.id]?.blockingNodeIds || []).map(id => nodeMap.get(id)?.title || id);
      const parent = node.parentId ? nodeMap.get(node.parentId) : null;
      const evidenceList = node.evidence || [];

      // Root goal for color mapping
      const rootGoal = useMemo(() => {
        return findNodeRootGoal(node.id, allNodes);
      }, [node.id, allNodes]);

      const goalPalette = rootGoal && goalColorMap ? (goalColorMap.get(rootGoal.id) || GOAL_COLOR_PALETTES[0]) : null;

      return (
        <div
          className={'print-break-avoid print-compact-row transition ' + (
            isCompact ? 'py-1.5 px-2' : 'py-2.5 px-3'
          ) + ' ' + (
            isDone ? 'bg-slate-50/50' : 'bg-white'
          )}
          style={goalPalette ? {
            borderLeft: '4px solid ' + goalPalette.border
          } : {}}
        >
          <div className="flex items-start space-x-2.5">
            {/* Square Printable Checkbox */}
            <div
              onClick={() => onToggleStatus(node)}
              className="w-4 h-4 rounded border-2 border-slate-900 flex items-center justify-center font-black text-[10px] flex-shrink-0 mt-0.5 cursor-pointer select-none bg-white"
            >
              {isDone ? '✓' : ''}
            </div>

            <div className="flex-1 min-w-0">
              {/* Line 1: Goal Tag + Title + Type badge + Parent breadcrumb */}
              <div className="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
                {/* Goal Tag Pill */}
                {rootGoal && goalPalette && (
                  <span
                    className="px-1.5 py-0.2 rounded text-[9px] font-black uppercase tracking-wider inline-flex items-center space-x-1 flex-shrink-0"
                    style={{
                      backgroundColor: goalPalette.badgeBg,
                      color: goalPalette.badgeText,
                      border: '1px solid ' + goalPalette.border
                    }}
                    title={'Goal: ' + rootGoal.title}
                  >
                    <span className="w-1.5 h-1.5 rounded-full inline-block" style={{ backgroundColor: goalPalette.dot }}></span>
                    <span className="truncate max-w-[120px]">{rootGoal.title}</span>
                  </span>
                )}

                {/* Title */}
                <span className={'font-bold text-xs sm:text-sm ' + (isDone ? 'line-through text-slate-400' : 'text-slate-900')}>
                  {node.title}
                </span>

                {/* Type Badge */}
                <span className="text-[9px] uppercase font-mono text-slate-400">
                  [{node.type.replace('_', ' ')}]
                </span>

                {/* Parent Breadcrumb */}
                {parent && parent.id !== rootGoal?.id && (
                  <span className="text-[10px] text-slate-400 font-normal truncate max-w-[150px]" title={'Parent: ' + parent.title}>
                    ↳ {parent.title}
                  </span>
                )}
              </div>

              {/* Line 2: Description (compact, no extra margins) */}
              {node.description && (
                <p className="text-[11px] text-slate-600 leading-snug mt-0.5">{node.description}</p>
              )}

              {/* Blocked info */}
              {isBlocked && blockerTitles.length > 0 && (
                <div className="text-[10px] font-bold text-rose-700 mt-0.5 flex items-center space-x-1">
                  <i className="fa-solid fa-lock text-[9px]"></i>
                  <span>Waiting on: {blockerTitles.join(', ')}</span>

              {/* Attached Notes & Evidence (Option to include notes) */}
              {includeNotes && evidenceList.length > 0 && (
                <div className="mt-1 space-y-1">
                  {evidenceList.map(ev => (
                    <div key={ev.id} className="p-1.5 rounded bg-amber-50/70 border border-amber-200 text-[10px] text-slate-800 leading-tight">

              {/* Handwriting Lines (Only if checked) */}
              {includeHandwritingLines && (
                <div className="mt-1.5 border-b border-dashed border-slate-300 h-3"></div>
              )}
            </div>
          </div>
        </div>
      );
