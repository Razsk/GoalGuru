<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Guru — LLM Planning Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel for immediate in-browser execution without complex build pipelines -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/help-data.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    @media print {
      /* Completely eliminate all website UI, headers, sidebars, toolbars, buttons, inputs, modals */
      header, nav, .app-header, .no-print, .no-print-area, button, select, input, [role="dialog"], .modal, .toast {
        display: none !important;
      }
      /* Clean white document without background tints or empty padding */
      html, body, #root, main {
        background: #ffffff !important;
        background-color: #ffffff !important;
        color: #0f172a !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
      }
      /* Expand the printable document cleanly across paper */
      .print-container {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      /* Ultra-compact print rows: remove extra margins */
      .print-compact-row {
        padding-top: 3px !important;
        padding-bottom: 3px !important;
        margin-top: 0 !important;
        margin-bottom: 0 !important;
      }
      /* Force browser to print goal colors, badge tints, and checkboxes */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .print-break-avoid {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      .print-border {
        border-color: #94a3b8 !important;
      }
      @page {
        margin: 1cm;
        size: auto;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const DEFAULT_RING_COLORS = [
      '#10b981', // Emerald
      '#6366f1', // Indigo
      '#06b6d4', // Cyan
      '#f59e0b', // Amber
      '#ec4899', // Pink
      '#8b5cf6', // Violet
    ];

    // Help & Context Context for Deep In-App Navigation
    const HelpContext = React.createContext({
      openTopic: () => {},
      openTerm: () => {},
      openHelp: () => {},
    });

    // Inline Markdown and Cross-Link Renderer for Help Content
    function RichHelpContent({ content, onNavigate }) {
      if (!content) return null;

      const codeBlockParts = content.split(/(```[\s\S]*?```)/g);

      return (
        <div className="space-y-3">
          {codeBlockParts.map((part, pIdx) => {
            if (part.startsWith('```')) {
              const cleaned = part.replace(/^```[a-z]*\n?/, '').replace(/```$/, '');
              return (
                <pre key={pIdx} className="bg-slate-900 text-slate-100 p-3.5 rounded-xl font-mono text-xs overflow-x-auto my-3 whitespace-pre-wrap leading-relaxed shadow-inner">
                  {cleaned}
                </pre>
              );
            }

            const lines = part.split('\n');
            return (
              <div key={pIdx} className="space-y-2">
                {lines.map((line, lIdx) => {
                  if (!line.trim()) return <div key={lIdx} className="h-1" />;

                  const isBullet = line.trim().startsWith('* ') || line.trim().startsWith('- ');
                  const isNumbered = /^\d+\.\s/.test(line.trim());
                  const cleanLine = isBullet ? line.trim().replace(/^[\*\-]\s+/, '') : isNumbered ? line.trim().replace(/^\d+\.\s+/, '') : line;

                  // Parse tokens: [label](term:id), [label](topic:id), **bold**, `code`
                  const elements = [];
                  let remaining = cleanLine;
                  let kIdx = 0;
                  const tokenRegex = /(\[([^\]]+)\]\((term|topic):([a-z0-9_-]+)\))|(\*\*([^*]+)\*\*)|(`([^`]+)`)/;

                  while (remaining) {
                    const match = remaining.match(tokenRegex);
                    if (!match) {
                      elements.push(<span key={kIdx++}>{remaining}</span>);
                      break;
                    }

                    const matchIndex = match.index;
                    if (matchIndex > 0) {
                      elements.push(<span key={kIdx++}>{remaining.slice(0, matchIndex)}</span>);
                    }

                    if (match[1]) {
                      const label = match[2];
                      const linkType = match[3];
                      const targetId = match[4];

                      elements.push(
                        <button
                          key={kIdx++}
                          type="button"
                          onClick={(e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            onNavigate(linkType === 'term' ? 'glossary' : 'guides', targetId);
                          }}
                          className={`inline-flex items-center space-x-1 px-1.5 py-0.5 mx-0.5 rounded text-[11px] font-semibold transition border ${
                            linkType === 'term'
                              ? 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border-indigo-200'
                              : 'bg-brand-50 hover:bg-brand-100 text-brand-700 border-brand-200'
                          }`}
                          title={`Open ${linkType === 'term' ? 'glossary term' : 'guide'}: ${label}`}
                        >
                          <i className={`fa-solid ${linkType === 'term' ? 'fa-book-bookmark' : 'fa-arrow-right'} text-[9px]`}></i>
                          <span>{label}</span>
                        </button>
                      );
                    } else if (match[5]) {
                      elements.push(<strong key={kIdx++} className="font-bold text-slate-900">{match[6]}</strong>);
                    } else if (match[7]) {
                      elements.push(<code key={kIdx++} className="bg-slate-100 text-slate-800 px-1 py-0.5 rounded font-mono text-[11px] border border-slate-200">{match[8]}</code>);
                    }

                    remaining = remaining.slice(matchIndex + match[0].length);
                  }

                  if (isBullet) {
                    return (
                      <div key={lIdx} className="flex items-start space-x-2 pl-2">
                        <span className="text-brand-500 font-bold mt-0.5">•</span>
                        <div className="flex-1 text-xs text-slate-700 leading-relaxed">{elements}</div>
                      </div>
                    );
                  }

                  if (isNumbered) {
                    const numMatch = line.trim().match(/^(\d+)\./);
                    const num = numMatch ? numMatch[1] : '1';
                    return (
                      <div key={lIdx} className="flex items-start space-x-2 pl-2">
                        <span className="w-4 h-4 rounded-full bg-slate-200 text-slate-700 text-[10px] font-bold flex items-center justify-center flex-shrink-0 mt-0.5">
                          {num}
                        </span>
                        <div className="flex-1 text-xs text-slate-700 leading-relaxed">{elements}</div>
                      </div>
                    );
                  }

                  return (
                    <p key={lIdx} className="text-xs text-slate-700 leading-relaxed">
                      {elements}
                    </p>
                  );
                })}
              </div>
            );
          })}
        </div>
      );
    }

    // Context Help Floating Trigger & Popover Button
    function ContextHelpButton({ title, summary, topicId, termId, align = 'left', size = 'sm' }) {
      const [isOpen, setIsOpen] = useState(false);
      const helpCtx = React.useContext(HelpContext);
      const popoverRef = React.useRef(null);

      useEffect(() => {
        if (!isOpen) return;
        function handleClickOutside(e) {
          if (popoverRef.current && !popoverRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        }
        function handleKeyDown(e) {
          if (e.key === 'Escape') setIsOpen(false);
        }
        document.addEventListener('mousedown', handleClickOutside);
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('mousedown', handleClickOutside);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, [isOpen]);

      return (
        <div className="relative inline-flex items-center" ref={popoverRef}>
          <button
            type="button"
            onClick={(e) => {
              e.preventDefault();
              e.stopPropagation();
              setIsOpen(!isOpen);
            }}
            className={`inline-flex items-center justify-center rounded-full transition ${
              isOpen ? 'text-brand-600 bg-brand-50 ring-2 ring-brand-200' : 'text-slate-400 hover:text-brand-600 hover:bg-slate-100'
            } ${size === 'sm' ? 'w-4 h-4 text-[11px]' : 'w-5 h-5 text-xs'}`}
            title={title ? `Context Help: ${title}` : 'Context Help'}
          >
            <i className="fa-regular fa-circle-question"></i>
          </button>

          {isOpen && (
            <div
              onClick={(e) => e.stopPropagation()}
              className={`absolute z-50 top-full mt-1.5 w-64 p-3 bg-white border border-slate-200 rounded-xl shadow-xl text-left transition-all ${
                align === 'right' ? 'right-0' : 'left-0'
              }`}
            >
              {title && (
                <div className="flex items-center justify-between pb-1.5 mb-1.5 border-b border-slate-100">
                  <span className="font-bold text-xs text-slate-900 flex items-center space-x-1">
                    <i className="fa-solid fa-lightbulb text-amber-500 text-[10px]"></i>
                    <span>{title}</span>
                  </span>
                  <button
                    type="button"
                    onClick={() => setIsOpen(false)}
                    className="text-slate-400 hover:text-slate-600 text-[10px] p-0.5"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
              )}

              {summary && <p className="text-[11px] text-slate-600 leading-relaxed mb-2.5">{summary}</p>}

              <div className="flex items-center gap-1.5 pt-1 border-t border-slate-100">
                {topicId && (
                  <button
                    type="button"
                    onClick={() => {
                      setIsOpen(false);
                      helpCtx.openTopic(topicId);
                    }}
                    className="flex-1 px-2 py-1 bg-brand-50 hover:bg-brand-100 text-brand-700 rounded-md font-semibold text-[10px] flex items-center justify-center space-x-1 transition"
                  >
                    <i className="fa-solid fa-book-open text-[9px]"></i>
                    <span>Read Guide</span>
                  </button>
                )}
                {termId && (
                  <button
                    type="button"
                    onClick={() => {
                      setIsOpen(false);
                      helpCtx.openTerm(termId);
                    }}
                    className="flex-1 px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-md font-semibold text-[10px] flex items-center justify-center space-x-1 transition"
                  >
                    <i className="fa-solid fa-bookmark text-[9px]"></i>
                    <span>Glossary</span>
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Comprehensive Interactive Help & Domain Glossary Modal
    function HelpModal({ isOpen, onClose, initialTab = 'guides', targetId }) {
      if (!isOpen) return null;

      const topics = window.GOALGURU_HELP_TOPICS || [];
      const terms = window.GOALGURU_GLOSSARY_TERMS || [];

      const [activeTab, setActiveTab] = useState(initialTab); // 'guides' | 'glossary'
      const [selectedTopicId, setSelectedTopicId] = useState(
        initialTab === 'guides' && targetId ? targetId : (topics[0]?.id || 'getting-started')
      );
      const [selectedTermId, setSelectedTermId] = useState(
        initialTab === 'glossary' && targetId ? targetId : (terms[0]?.id || 'goal')
      );
      const [searchQuery, setSearchQuery] = useState('');
      const [guideCategoryFilter, setGuideCategoryFilter] = useState('all');
      const [glossaryCategoryFilter, setGlossaryCategoryFilter] = useState('all');
      const [historyStack, setHistoryStack] = useState([]);

      useEffect(() => {
        if (targetId) {
          if (initialTab === 'guides') setSelectedTopicId(targetId);
          if (initialTab === 'glossary') setSelectedTermId(targetId);
          setActiveTab(initialTab);
        }
      }, [initialTab, targetId]);

      const navigateTo = (tab, id) => {
        setHistoryStack(prev => [...prev, { tab: activeTab, id: activeTab === 'guides' ? selectedTopicId : selectedTermId }]);
        setActiveTab(tab);
        if (tab === 'guides') setSelectedTopicId(id);
        else setSelectedTermId(id);
      };

      const goBack = () => {
        if (historyStack.length === 0) return;
        const prev = historyStack[historyStack.length - 1];
        setHistoryStack(prevStack => prevStack.slice(0, -1));
        setActiveTab(prev.tab);
        if (prev.tab === 'guides') setSelectedTopicId(prev.id);
        else setSelectedTermId(prev.id);
      };

      // Filtered lists based on search and category
      const filteredTopics = useMemo(() => {
        const q = searchQuery.toLowerCase().trim();
        return topics.filter(t => {
          const matchesCategory = guideCategoryFilter === 'all' || t.category === guideCategoryFilter;
          const matchesSearch = !q || 
            t.title.toLowerCase().includes(q) || 
            t.summary.toLowerCase().includes(q) || 
            t.sections.some(s => s.title.toLowerCase().includes(q) || s.content.toLowerCase().includes(q));
          return matchesCategory && matchesSearch;
        });
      }, [topics, searchQuery, guideCategoryFilter]);

      const filteredTerms = useMemo(() => {
        const q = searchQuery.toLowerCase().trim();
        return terms.filter(t => {
          const matchesCategory = glossaryCategoryFilter === 'all' || t.category === glossaryCategoryFilter;
          const matchesSearch = !q || 
            t.term.toLowerCase().includes(q) || 
            t.definition.toLowerCase().includes(q) || 
            t.details.toLowerCase().includes(q) || 
            t.avoid.some(a => a.toLowerCase().includes(q));
          return matchesCategory && matchesSearch;
        });
      }, [terms, searchQuery, glossaryCategoryFilter]);

      const currentTopic = topics.find(t => t.id === selectedTopicId) || topics[0];
      const currentTerm = terms.find(t => t.id === selectedTermId) || terms[0];

      const guideCategories = ['all', 'Getting Started', 'Core Concepts', 'Collaboration Protocol', 'Execution & Analytics'];
      const glossaryCategories = ['all', 'Organization & Accounts', 'Core Language', 'Proposal & Exchange', 'Execution & Lifecycle'];

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-6">
          <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-5xl w-full h-[90vh] flex flex-col overflow-hidden">
            {/* Modal Header */}
            <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between flex-shrink-0">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold text-lg shadow-md">
                  <i className="fa-solid fa-compass"></i>
                </div>
                <div>
                  <h3 className="text-base font-black tracking-tight text-white flex items-center space-x-2">
                    <span>Goal Guru Help & Domain Glossary</span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-brand-500/30 text-brand-200 border border-brand-400/40">
                      Authoritative State
                    </span>
                  </h3>
                  <p className="text-xs text-slate-400">
                    Interactive guides, context reference, and canonical domain terms
                  </p>
                </div>
              </div>

              {/* Close Button */}
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition"
                title="Close help modal"
              >
                <i className="fa-solid fa-xmark text-sm"></i>
              </button>
            </div>

            {/* Top Toolbar: Search & Tab Switcher */}
            <div className="px-6 py-3 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 flex-shrink-0">
              {/* Tabs */}
              <div className="inline-flex bg-slate-200/80 p-1 rounded-xl text-xs font-bold shadow-inner">
                <button
                  onClick={() => setActiveTab('guides')}
                  className={`px-3 py-1.5 rounded-lg flex items-center space-x-2 transition ${
                    activeTab === 'guides' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <i className="fa-solid fa-book-open text-xs text-brand-600"></i>
                  <span>Help Guides ({topics.length})</span>
                </button>
                <button
                  onClick={() => setActiveTab('glossary')}
                  className={`px-3 py-1.5 rounded-lg flex items-center space-x-2 transition ${
                    activeTab === 'glossary' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <i className="fa-solid fa-book-bookmark text-xs text-indigo-600"></i>
                  <span>Domain Glossary ({terms.length})</span>
                </button>
              </div>

              {/* Search Bar */}
              <div className="relative flex-1 max-w-md">
                <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input
                  type="text"
                  placeholder={activeTab === 'guides' ? 'Search guides & instructions...' : 'Search terms, synonyms, definitions...'}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-8 pr-8 py-1.5 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-2xs"
                />
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery('')}
                    className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                )}
              </div>
            </div>

            {/* Main Content Area: Split Sidebar & Content Viewer */}
            <div className="flex-1 flex overflow-hidden">
              {/* Left Navigation Sidebar */}
              <div className="w-72 sm:w-80 border-r border-slate-200 bg-slate-50/70 flex flex-col flex-shrink-0 overflow-hidden">
                {/* Category Filter Pills */}
                <div className="p-3 border-b border-slate-200/80 overflow-x-auto custom-scrollbar flex items-center space-x-1.5">
                  {(activeTab === 'guides' ? guideCategories : glossaryCategories).map(cat => (
                    <button
                      key={cat}
                      onClick={() => activeTab === 'guides' ? setGuideCategoryFilter(cat) : setGlossaryCategoryFilter(cat)}
                      className={`px-2 py-0.5 rounded-md text-[10px] font-semibold whitespace-nowrap transition ${
                        (activeTab === 'guides' ? guideCategoryFilter : glossaryCategoryFilter) === cat
                          ? 'bg-slate-900 text-white'
                          : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      {cat === 'all' ? 'All' : cat}
                    </button>
                  ))}
                </div>

                {/* Items List */}
                <div className="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                  {activeTab === 'guides' ? (
                    filteredTopics.length === 0 ? (
                      <div className="text-center py-8 text-xs text-slate-400">No guides matching "{searchQuery}"</div>
                    ) : (
                      filteredTopics.map(topic => {
                        const isSelected = topic.id === currentTopic?.id;
                        return (
                          <button
                            key={topic.id}
                            onClick={() => setSelectedTopicId(topic.id)}
                            className={`w-full text-left p-2.5 rounded-xl border text-xs transition flex items-start space-x-2.5 ${
                              isSelected
                                ? 'bg-white border-brand-300 ring-2 ring-brand-100 text-brand-950 font-bold shadow-xs'
                                : 'bg-transparent border-transparent hover:bg-white hover:border-slate-200 text-slate-700'
                            }`}
                          >
                            <i className={`fa-solid ${topic.icon} text-sm mt-0.5 ${isSelected ? 'text-brand-600' : 'text-slate-400'}`}></i>
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center justify-between gap-1">
                                <span className="truncate font-semibold">{topic.title}</span>
                              </div>
                              <span className="text-[10px] text-slate-400 font-normal block truncate mt-0.5">
                                {topic.category} • {topic.readTime}
                              </span>
                            </div>
                          </button>
                        );
                      })
                    )
                  ) : (
                    filteredTerms.length === 0 ? (
                      <div className="text-center py-8 text-xs text-slate-400">No terms matching "{searchQuery}"</div>
                    ) : (
                      filteredTerms.map(term => {
                        const isSelected = term.id === currentTerm?.id;
                        return (
                          <button
                            key={term.id}
                            onClick={() => setSelectedTermId(term.id)}
                            className={`w-full text-left p-2.5 rounded-xl border text-xs transition flex items-start space-x-2.5 ${
                              isSelected
                                ? 'bg-white border-indigo-300 ring-2 ring-indigo-100 text-indigo-950 font-bold shadow-xs'
                                : 'bg-transparent border-transparent hover:bg-white hover:border-slate-200 text-slate-700'
                            }`}
                          >
                            <i className={`fa-solid fa-bookmark text-sm mt-0.5 ${isSelected ? 'text-indigo-600' : 'text-slate-300'}`}></i>
                            <div className="flex-1 min-w-0">
                              <span className="truncate font-semibold block">{term.term}</span>
                              <span className="text-[10px] text-slate-400 font-normal block truncate mt-0.5">
                                {term.category}
                              </span>
                            </div>
                          </button>
                        );
                      })
                    )
                  )}
                </div>
              </div>

              {/* Right Main Content Viewer */}
              <div className="flex-1 overflow-y-auto custom-scrollbar p-6 bg-white flex flex-col justify-between">
                <div>
                  {/* History Back Button */}
                  {historyStack.length > 0 && (
                    <button
                      onClick={goBack}
                      className="inline-flex items-center space-x-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900 pb-2 mb-4 border-b border-slate-100 transition"
                    >
                      <i className="fa-solid fa-arrow-left"></i>
                      <span>Back to previous view</span>
                    </button>
                  )}

                  {activeTab === 'guides' && currentTopic ? (
                    <div className="space-y-6 max-w-3xl">
                      {/* Topic Header */}
                      <div>
                        <div className="flex items-center space-x-2 mb-2">
                          <span className="px-2.5 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wider bg-brand-50 text-brand-700 border border-brand-200">
                            {currentTopic.category}
                          </span>
                          <span className="text-xs text-slate-400 flex items-center space-x-1">
                            <i className="fa-regular fa-clock text-[10px]"></i>
                            <span>{currentTopic.readTime}</span>
                          </span>
                        </div>
                        <h2 className="text-2xl font-black text-slate-900 tracking-tight flex items-center space-x-2.5">
                          <i className={`fa-solid ${currentTopic.icon} text-brand-600`}></i>
                          <span>{currentTopic.title}</span>
                        </h2>

    function getDescendantNodes(parentId, nodes) {
      const childrenMap = new Map();
      nodes.forEach(node => {
        if (node.parentId) {
          if (!childrenMap.has(node.parentId)) childrenMap.set(node.parentId, []);
          childrenMap.get(node.parentId).push(node);
        }
      });
      const descendants = [];
      const queue = [parentId];
      while (queue.length > 0) {
        const currentId = queue.shift();
        const children = childrenMap.get(currentId) || [];
        children.forEach(c => {
          descendants.push(c);
          queue.push(c.id);
        });
      }
      return descendants;
    }

    function computeNodeProgress(node, allNodes) {
      if (node.type === 'action' || node.type === 'sub_action') {
        const descendants = getDescendantNodes(node.id, allNodes);
        const subActions = descendants.filter(n => n.type === 'sub_action');
        if (subActions.length === 0) {
          const isDone = node.status === 'done' ? 1 : 0;
          return { completed: isDone, total: 1, percentage: isDone ? 100 : 0 };
        }
        const total = subActions.length + 1;
        const completed = (node.status === 'done' ? 1 : 0) + subActions.filter(n => n.status === 'done').length;
        return { completed, total, percentage: Math.round((completed / total) * 100) };
      }
      const descendants = getDescendantNodes(node.id, allNodes);
      const actions = descendants.filter(n => n.type === 'action' || n.type === 'sub_action');
      if (actions.length === 0) {
        const isDone = node.status === 'done' ? 1 : 0;
        return { completed: isDone, total: 1, percentage: isDone ? 100 : 0 };
      }
      const completed = actions.filter(n => n.status === 'done').length;
      const total = actions.length;
      return { completed, total, percentage: Math.round((completed / total) * 100) };
    }

    function computeWorkspaceProgress(nodes, readinessMap) {
      const activeNodes = (nodes || []).filter(n => !n.archivedAt);
      const archivedGoalsCount = (nodes || []).filter(n => n.type === 'goal' && !!n.archivedAt).length;

      const actionsList = activeNodes.filter(n => n.type === 'action' || n.type === 'sub_action');
      const milestonesList = activeNodes.filter(n => n.type === 'milestone');
      const goalsList = activeNodes.filter(n => n.type === 'goal' || n.type === 'sub_goal');
      const rootGoals = activeNodes.filter(n => n.type === 'goal');

      const computeGroup = (list) => {
        const total = list.length;
        if (total === 0) return { total: 0, completed: 0, inProgress: 0, todo: 0, abandoned: 0, percentage: 0 };
        const completed = list.filter(n => n.status === 'done').length;
        const inProgress = list.filter(n => n.status === 'in_progress').length;
        const todo = list.filter(n => n.status === 'todo').length;
        const abandoned = list.filter(n => n.status === 'abandoned').length;
        return { total, completed, inProgress, todo, abandoned, percentage: Math.round((completed / total) * 100) };
      };

      const actions = computeGroup(actionsList);
      const milestones = computeGroup(milestonesList);
      const goals = computeGroup(goalsList);

      const totalNodes = activeNodes.length;
      const completedNodes = activeNodes.filter(n => n.status === 'done').length;
      const overallPercentage = totalNodes > 0 ? Math.round((completedNodes / totalNodes) * 100) : 0;

      const pipeline = { ready: [], inProgress: [], blocked: [], done: [], abandoned: [] };
      activeNodes.forEach(node => {
        const isBlocked = readinessMap?.[node.id]?.readiness === 'blocked';
        if (node.status === 'done') pipeline.done.push(node);
        else if (node.status === 'abandoned') pipeline.abandoned.push(node);
        else if (isBlocked) pipeline.blocked.push(node);
        else if (node.status === 'in_progress') pipeline.inProgress.push(node);
        else pipeline.ready.push(node);
      });

      const tierRings = [
        { id: 'ring_actions', label: 'Actions & Tasks', completed: actions.completed, total: actions.total, percentage: actions.percentage, color: '#10b981' },
        { id: 'ring_milestones', label: 'Milestones', completed: milestones.completed, total: milestones.total, percentage: milestones.percentage, color: '#6366f1' },
        { id: 'ring_goals', label: 'Goals & Objectives', completed: goals.completed, total: goals.total, percentage: goals.percentage, color: '#06b6d4' },
      ];

      const goalSummaries = [];
      const goalRings = [];

      rootGoals.forEach((goal, index) => {
        const descendants = getDescendantNodes(goal.id, activeNodes);
        const goalActions = descendants.filter(n => n.type === 'action' || n.type === 'sub_action');
        const goalMilestones = descendants.filter(n => n.type === 'milestone');
        const totalActions = goalActions.length;
        const completedActions = goalActions.filter(n => n.status === 'done').length;
        const milestonesCount = goalMilestones.length;
        const completedMilestonesCount = goalMilestones.filter(n => n.status === 'done').length;
        const percentage = totalActions > 0 ? Math.round((completedActions / totalActions) * 100) : (goal.status === 'done' ? 100 : 0);

        goalSummaries.push({
          goal,
          totalActions,
          completedActions,
          percentage,
          milestonesCount,
          completedMilestonesCount,
          status: goal.status
        });

        goalRings.push({
          id: `ring_goal_${goal.id}`,
          label: goal.title,
          completed: completedActions,
          total: totalActions,
          percentage,
          color: DEFAULT_RING_COLORS[index % DEFAULT_RING_COLORS.length]
        });
      });

      return {
        overallPercentage,
        totalNodes,
        completedNodes,
        archivedGoalsCount,
        actions,
        milestones,
        goals,
        pipeline,
        tierRings,
        goalRings,
        goalSummaries
      };
    }

    // Interactive Concentric Multi-Ring Progress Chart (Apple Activity Style)
    function MultiRingChart({ rings, size = 200, strokeWidth = 10, gap = 5, centerValue, centerLabel, centerSubtext }) {
      const [hoveredRingId, setHoveredRingId] = useState(null);

      const center = size / 2;
      const hoveredRing = rings.find(r => r.id === hoveredRingId);

      const displayValue = hoveredRing ? `${hoveredRing.percentage}%` : centerValue;
      const displayLabel = hoveredRing ? hoveredRing.label : centerLabel;
      const displaySubtext = hoveredRing ? `${hoveredRing.completed} / ${hoveredRing.total} Done` : centerSubtext;

      return (
        <div className="relative inline-flex items-center justify-center select-none flex-shrink-0">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="transform -rotate-90">
            {rings.map((ring, index) => {
              const radius = center - strokeWidth / 2 - 4 - index * (strokeWidth + gap);
              if (radius <= 0) return null;
              const circumference = 2 * Math.PI * radius;
              const clampedPct = Math.min(100, Math.max(0, ring.percentage || 0));
              const strokeDashoffset = circumference - (clampedPct / 100) * circumference;
              const isHovered = hoveredRingId === ring.id;

              return (
                <g key={ring.id} className="cursor-pointer transition-all duration-200">
                  {/* Background track circle */}
                  <circle
                    cx={center}
                    cy={center}
                    r={radius}
                    fill="none"
                    stroke={ring.color}
                    strokeWidth={strokeWidth}
                    strokeOpacity={0.15}
                  />
                  {/* Foreground progress arc */}
                  <circle
                    cx={center}
                    cy={center}
                    r={radius}
                    fill="none"
                    stroke={ring.color}
                    strokeWidth={strokeWidth}
                    strokeDasharray={circumference}
                    strokeDashoffset={strokeDashoffset}
                    strokeLinecap="round"
                    style={{
                      transition: 'stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s',
                    }}
                    opacity={clampedPct === 0 ? 0 : (hoveredRingId && !isHovered ? 0.35 : 1)}
                    onMouseEnter={() => setHoveredRingId(ring.id)}
                    onMouseLeave={() => setHoveredRingId(null)}
                  />
                </g>
              );
            })}
          </svg>

          {/* Centered Readout Overlay (Unrotated) */}
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center p-3 pointer-events-none">
            <span className="text-2xl font-black tracking-tight text-slate-900 leading-none">
              {displayValue}
            </span>
            <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 mt-1 truncate max-w-[110px]">
              {displayLabel}
            </span>
            {displaySubtext && (
              <span className="text-[10px] font-mono text-slate-400 mt-0.5">
                {displaySubtext}
              </span>
            )}
          </div>
        </div>
      );
    }

    // Mini Circular Progress Ring for Tree View (e.g. on Goal Nodes)
    function MiniProgressRing({ percentage, size = 26, strokeWidth = 3, color = '#6366f1' }) {
      const radius = (size - strokeWidth) / 2;

    // Milestone Execution Horizon Stepper Component
    function MilestoneRoadmapView({ graphData, onToggleStatus, onExport }) {
      const milestones = (graphData.nodes || []).filter(n => n.type === 'milestone');
      const nodesMap = new Map((graphData.nodes || []).map(n => [n.id, n]));

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-500">
              Milestone Execution Horizon ({milestones.length} Milestones)

          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {milestones.map((ms, idx) => {
              const readinessInfo = graphData.readiness?.[ms.id];

              const blockerTitles = readinessInfo?.blockingNodeTitles || (readinessInfo?.blockingNodeIds || []).map(id => {
                const blocker = nodesMap.get(id);
                return blocker?.title || id;
              });
              const parentGoal = ms.parentId ? nodesMap.get(ms.parentId) : null;
              const msProgress = computeNodeProgress(ms, graphData.nodes);

              return (
                <div
                  key={ms.id}
                  className={`rounded-2xl border p-4.5 transition-all shadow-xs relative flex flex-col justify-between ${
                    ms.status === 'done'
                      ? 'bg-emerald-50/40 border-emerald-200'
                      : ms.status === 'in_progress'
                      ? 'bg-amber-50/40 border-amber-300 ring-2 ring-amber-200/50'
                      : isBlocked
                      ? 'bg-rose-50/40 border-rose-200'
                      : 'bg-white border-slate-200'
                  }`}
                >
                  <div>
                    {/* Step Number & Badges */}
                    <div className="flex items-center justify-between gap-2 mb-2">
                      <div className="flex items-center space-x-2">
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black ${
                          ms.status === 'done' ? 'bg-emerald-600 text-white' :
                          ms.status === 'in_progress' ? 'bg-amber-500 text-white animate-pulse' :
                          isBlocked ? 'bg-rose-500 text-white' : 'bg-slate-200 text-slate-700'
                        }`}>

    // --- Topological Order & Cycle Check Utilities for Dependencies & Print ---
    function computeTopologicalOrder(items, dependencies) {
      if (!items || items.length <= 1) return items || [];
      const itemMap = new Map();
      items.forEach(item => itemMap.set(item.id, item));
      const inDegree = new Map();
      const adjacency = new Map();
      items.forEach(item => {
        inDegree.set(item.id, 0);
        adjacency.set(item.id, []);
      });
      (dependencies || []).forEach(dep => {
        if (itemMap.has(dep.fromNodeId) && itemMap.has(dep.toNodeId)) {
          adjacency.get(dep.fromNodeId).push(dep.toNodeId);
          inDegree.set(dep.toNodeId, (inDegree.get(dep.toNodeId) || 0) + 1);
        }
      });
      const queue = [];
      items.forEach(item => {
        if ((inDegree.get(item.id) || 0) === 0) {
          queue.push(item.id);
        }
      });
      const sorted = [];
      const visited = new Set();
      while (queue.length > 0) {
        const currentId = queue.shift();
        visited.add(currentId);
        sorted.push(itemMap.get(currentId));
        const neighbors = adjacency.get(currentId) || [];
        for (const neighborId of neighbors) {
          const remaining = (inDegree.get(neighborId) || 0) - 1;
          inDegree.set(neighborId, remaining);
          if (remaining === 0) {
            queue.push(neighborId);
          }
        }
      }
      items.forEach(item => {
        if (!visited.has(item.id)) sorted.push(item);
      });
      return sorted;
    }

    function checkWouldCreateCycle(fromNodeId, toNodeId, existingDeps) {
      if (fromNodeId === toNodeId) return true;
      const adjacency = new Map();
      existingDeps.forEach(d => {
        if (!adjacency.has(d.fromNodeId)) adjacency.set(d.fromNodeId, []);
        adjacency.get(d.fromNodeId).push(d.toNodeId);
      });
      // If we add fromNodeId -> toNodeId, cycle occurs if toNodeId can already reach fromNodeId
      const visited = new Set();
      const queue = [toNodeId];
      while (queue.length > 0) {
        const curr = queue.shift();
        if (curr === fromNodeId) return true;
        if (!visited.has(curr)) {
          visited.add(curr);
          const neighbors = adjacency.get(curr) || [];
          for (const n of neighbors) {
            if (!visited.has(n)) queue.push(n);
          }
        }
      }
      return false;
    }

    // --- Goal Color Palette & Lineage Helpers ---
    const GOAL_COLOR_PALETTES = [
      { id: 'indigo', name: 'Indigo', border: '#6366f1', badgeBg: '#e0e7ff', badgeText: '#3730a3', bgLight: '#f8faff', dot: '#4f46e5' },
