    function App() {
      const [user, setUser] = useState(null);
      const [workspaces, setWorkspaces] = useState([]);
      const [currentWorkspaceId, setCurrentWorkspaceId] = useState(null);
      const [graphData, setGraphData] = useState({ nodes: [], dependencies: [], readiness: {}, stateVersion: 1 });
      const [loading, setLoading] = useState(true);

      // Views & Progress state
      const getInitialView = () => {
        try {
          const params = new URLSearchParams(window.location.search);
          const v = params.get('view');
          if (v === 'print' || window.location.pathname.endsWith('/print')) return 'print';
          if (v === 'dependencies') return 'dependencies';
          if (v === 'analytics') return 'analytics';
          if (v === 'archive' || v === 'archived') return 'archive';
          return 'tree';
        } catch {
          return 'tree';
        }
      };
      const [activeView, setActiveView] = useState(getInitialView);

      const switchView = (v) => {
        setActiveView(v);
        try {
          const url = new URL(window.location);
          if (v === 'tree') {
            url.searchParams.delete('view');
          } else {
            url.searchParams.set('view', v);
          }
          window.history.pushState({}, '', url);
        } catch {}
      };

      useEffect(() => {
        const onPopState = () => {
          setActiveView(getInitialView());
        };
        window.addEventListener('popstate', onPopState);
        return () => window.removeEventListener('popstate', onPopState);
      }, []);

      // Global Ctrl+P / Cmd+P listener: cleanly switches to print checklist without website UI
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
            if (activeView !== 'print') {
              e.preventDefault();
              switchView('print');
              setTimeout(() => {
                window.print();
              }, 250);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeView]);
      const [bannerCollapsed, setBannerCollapsed] = useState(false);

      // Real-time calculated progress summary across the workspace
      const progressSummary = useMemo(() => {
        return computeWorkspaceProgress(graphData.nodes || [], graphData.readiness || {});
      }, [graphData.nodes, graphData.readiness]);

      // Modals
      const [exportModalNode, setExportModalNode] = useState(null);
      const [showImportModal, setShowImportModal] = useState(false);
      const [showAgentSetupModal, setShowAgentSetupModal] = useState(false);
      const [showErrorModal, setShowErrorModal] = useState(false);
      const [showNewGoalModal, setShowNewGoalModal] = useState(false);
      const [evidenceModalNode, setEvidenceModalNode] = useState(null);
      const [addChildModal, setAddChildModal] = useState({ isOpen: false, parentNode: null, defaultType: 'milestone' });
      const [helpModalConfig, setHelpModalConfig] = useState({ isOpen: false, tab: 'guides', targetId: 'getting-started' });
      const [newGoalTitle, setNewGoalTitle] = useState('');
      const [newGoalDesc, setNewGoalDesc] = useState('');
      const [unresolvedErrorCount, setUnresolvedErrorCount] = useState(0);

      const handleOpenAddChild = (parentNode, defaultType = 'milestone') => {
        setAddChildModal({ isOpen: true, parentNode, defaultType });
      };

      const openHelpTopic = (topicId) => {
        setHelpModalConfig({ isOpen: true, tab: 'guides', targetId: topicId });
      };

      const openGlossaryTerm = (termId) => {
        setHelpModalConfig({ isOpen: true, tab: 'glossary', targetId: termId });
      };

      const refreshErrorCount = async () => {
        try {
          const res = await fetch('/api/errors?status=unresolved');
          const data = await res.json();
          if (data.errors) {
            setUnresolvedErrorCount(data.errors.length);
          }
        } catch {}
      };

      // Status toast
      const [toast, setToast] = useState(null);
      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        if (type === 'error') {
          refreshErrorCount();
        }
        setTimeout(() => setToast(null), 4000);
      };

      // Load initial user & workspaces
      useEffect(() => {
        async function init() {
          try {
            const userRes = await fetch('/api/auth/me');
            const userData = await userRes.json();
            setUser(userData);

            const wsRes = await fetch('/api/workspaces');
            const wsData = await wsRes.json();
            setWorkspaces(wsData);
            if (wsData.length > 0) {
              setCurrentWorkspaceId(wsData[0].id);
            }
            refreshErrorCount();
          } catch (err) {
            console.error(err);
            showToast('Failed to load workspaces', 'error');
          } finally {
            setLoading(false);
          }
        }
        init();
      }, []);

      // Load graph when workspace changes
      const loadGraph = async () => {
        if (!currentWorkspaceId) return;
        try {
          const res = await fetch(`/api/workspaces/${currentWorkspaceId}/graph`);
          const data = await res.json();
          setGraphData(data);
        } catch (err) {
          console.error(err);
          showToast('Failed to load graph', 'error');
        }
      };

      useEffect(() => {
        loadGraph();
      }, [currentWorkspaceId]);

      // Create new top-level goal
      const handleCreateGoal = async (e) => {
        e.preventDefault();
        if (!newGoalTitle.trim() || !currentWorkspaceId) return;
        try {
          const res = await fetch(`/api/workspaces/${currentWorkspaceId}/nodes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type: 'goal',
              title: newGoalTitle,
              description: newGoalDesc,
              status: 'in_progress'
            }),
          });
          if (res.ok) {
            showToast('Goal created successfully!');
            setNewGoalTitle('');
            setNewGoalDesc('');
            setShowNewGoalModal(false);
            loadGraph();
          }
        } catch (err) {
          showToast('Failed to create goal', 'error');
        }
      };

      // Toggle status
      const handleToggleStatus = async (node) => {
        const nextStatus = node.status === 'todo' ? 'in_progress' : node.status === 'in_progress' ? 'done' : 'todo';
        try {
          await fetch(`/api/nodes/${node.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: nextStatus })
          });
          loadGraph();
        } catch (err) {
          showToast('Failed to update status', 'error');
        }
      };

      // Delete node
      const handleDeleteNode = async (nodeId) => {
        if (!confirm('Are you sure you want to delete this node and its sub-items?')) return;
        try {
          await fetch(`/api/nodes/${nodeId}`, { method: 'DELETE' });
          showToast('Node deleted');
          loadGraph();
        } catch (err) {
          showToast('Failed to delete node', 'error');
        }
      };

      // Undo
      const handleUndo = async () => {
        try {
          const res = await fetch(`/api/workspaces/${currentWorkspaceId}/undo`, { method: 'POST' });
          const data = await res.json();
          if (data.success) {
            showToast('Undid last plan changes!');
            loadGraph();
          } else {
            showToast('No proposals to undo', 'info');
          }
        } catch (err) {
          showToast('Undo failed', 'error');
        }
      };

      // Archive Goal
      const handleArchiveGoal = async (goalId) => {
        try {
          const res = await fetch(`/api/nodes/${goalId}/archive`, { method: 'POST' });
          const data = await res.json();
          if (res.ok && data.success) {
            showToast('Goal moved to Archive!');
            loadGraph();
          } else {
            showToast(data.error || 'Failed to archive goal', 'error');
          }
        } catch (err) {
          showToast('Failed to archive goal', 'error');
        }
      };

      // Unarchive Goal
      const handleUnarchiveGoal = async (goalId) => {
        try {
          const res = await fetch(`/api/nodes/${goalId}/unarchive`, { method: 'POST' });
          const data = await res.json();
          if (res.ok && data.success) {
            showToast('Goal restored to active plan!');
            loadGraph();
          } else {
            showToast(data.error || 'Failed to restore goal', 'error');
          }
        } catch (err) {
          showToast('Failed to restore goal', 'error');
        }
      };

      // Tree structure helper: Active goals (excluding archived)
      const tree = useMemo(() => {
        const nodeMap = new Map();
        const roots = [];
        const activeNodes = (graphData.nodes || []).filter(n => !n.archivedAt);

        activeNodes.forEach(n => {
          nodeMap.set(n.id, { ...n, children: [] });
        });

        activeNodes.forEach(n => {
          const item = nodeMap.get(n.id);
          if (n.parentId && nodeMap.has(n.parentId)) {
            nodeMap.get(n.parentId).children.push(item);
          } else if (n.type === 'goal') {
            roots.push(item);
          }
        });

        return roots;
      }, [graphData.nodes]);

      // Archived goals tree
      const archivedTree = useMemo(() => {
        const nodeMap = new Map();
        const roots = [];
        const archivedNodes = (graphData.nodes || []).filter(n => !!n.archivedAt);

        archivedNodes.forEach(n => {
          nodeMap.set(n.id, { ...n, children: [] });
        });

        archivedNodes.forEach(n => {
          const item = nodeMap.get(n.id);
          if (n.parentId && nodeMap.has(n.parentId)) {
            nodeMap.get(n.parentId).children.push(item);
          } else if (n.type === 'goal') {
            roots.push(item);
          }
        });

        return roots;
      }, [graphData.nodes]);

        return (graphData.nodes || []).filter(n => n.type === 'goal' && !!n.archivedAt).length;

                    </div>

                  </div>

                <button

                <button

                    activeView === 'archive' 
                      ? 'bg-white text-brand-700 shadow-xs border border-slate-200/70' 
                      : 'text-slate-600 hover:text-slate-900 hover:bg-white/50 border border-transparent'
                  }`}
                  title="Archive: Completed goals preserved outside active scope"
                >
                  <i className="fa-solid fa-box-archive text-xs"></i>
                  <span>Archive</span>
                  {archivedCount > 0 && (
                    <span className={`text-[10px] font-mono font-bold px-1.5 py-0.2 rounded-full whitespace-nowrap transition-colors ${
                      activeView === 'archive'
                        ? 'bg-slate-200 text-slate-800'
                        : 'bg-slate-200/80 text-slate-600'
                    }`}>
                      {archivedCount}
                    </span>

                </button>
              </nav>

              {/* Right: Primary Actions & Utility Icons */}
              <div className="flex items-center space-x-2 sm:space-x-2.5 shrink-0">
                {/* Primary Actions */}
                <button
                  onClick={() => setShowImportModal(true)}
                  title="Import LLM proposal from clipboard"
                  className="hidden sm:flex px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100/90 active:bg-emerald-200 text-emerald-700 border border-emerald-200/80 rounded-xl font-semibold text-xs items-center space-x-1.5 transition shadow-2xs whitespace-nowrap shrink-0"
                >
                  <i className="fa-solid fa-file-import text-emerald-600 text-xs"></i>
                  <span>Import Proposal</span>
                </button>

                <button
                  onClick={() => setShowNewGoalModal(true)}
                  title="Create new strategic goal"
                  className="px-3.5 py-1.5 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 active:scale-[0.98] text-white rounded-xl font-semibold text-xs flex items-center space-x-1.5 shadow-sm hover:shadow transition-all whitespace-nowrap shrink-0"
                >
                  <i className="fa-solid fa-plus text-xs"></i>
                  <span>New Goal</span>
                </button>

                <div className="h-5 w-px bg-slate-200 shrink-0"></div>

                {/* Utilities Group */}
                <div className="flex items-center space-x-0.5 sm:space-x-1 shrink-0">
                  <button

                    title="Undo last proposal commit (Ctrl+Z)"

                  >
                    <i className="fa-solid fa-rotate-left text-xs"></i>
                  </button>

                  <button

                    className="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-brand-600 hover:bg-slate-100 active:bg-slate-200 rounded-lg transition-colors shrink-0"
                  >
                    <i className="fa-solid fa-robot text-xs"></i>

                      unresolvedErrorCount > 0

                        {unresolvedErrorCount}

                  <button

                    title="Help Guides & Domain Glossary"

                <div className="h-5 w-px bg-slate-200 shrink-0"></div>

                <div

            </div>

            {/* Mobile View Switcher Tab Bar */}
            <div className="md:hidden border-t border-slate-200/80 px-2 py-1.5 flex items-center justify-around bg-white/95 backdrop-blur-md shadow-2xs">

              >

              <button

                className={`px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition whitespace-nowrap ${

                }`}
              >
                <i className="fa-solid fa-network-wired text-xs"></i>
                <span>Deps</span>
              </button>

              <button

              <button

              >

                <span>Archive</span>
                {archivedCount > 0 && (

                    {archivedCount}

            </div>

          {/* Main Content */}

              <div>
                <h2 className="text-2xl font-bold text-slate-900">

                    : activeView === 'dependencies'

                    : activeView === 'archive'

                graphData={graphData}
                onToggleStatus={handleToggleStatus}
                onExport={(n) => setExportModalNode(n)}
                onAddEvidence={(n) => setEvidenceModalNode(n)}
              />
            ) : activeView === 'archive' ? (
              <ArchivedGoalsView
                archivedGoals={archivedTree}
                onUnarchive={handleUnarchiveGoal}
                onDelete={handleDeleteNode}
                onBack={() => switchView('tree')}
                showToast={showToast}
              />
            ) : (
              <div>
                {/* Collapsible Overview Banner with Multi-Ring Chart */}
                <ProgressOverviewBanner
                  progressSummary={progressSummary}
                  collapsed={bannerCollapsed}
                  onToggleCollapse={() => setBannerCollapsed(!bannerCollapsed)}
                />

                {/* Tree Container */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                  {archivedCount > 0 && (
                    <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-100 text-xs text-slate-500">
                      <span className="flex items-center space-x-1.5">
                        <i className="fa-solid fa-circle-info text-slate-400"></i>
                        <span>Showing active goals. <strong>{archivedCount}</strong> completed goal{archivedCount === 1 ? ' is' : 's are'} in the archive.</span>
                      </span>
                      <button
                        onClick={() => switchView('archive')}
                        className="text-brand-600 hover:text-brand-700 font-semibold flex items-center space-x-1 transition"
                      >
                        <i className="fa-solid fa-box-archive text-[11px]"></i>
                        <span>View Archive</span>
                      </button>
                    </div>
                  )}

                  {tree.length === 0 ? (
                    <div className="text-center py-16">
                      <div className="w-16 h-16 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-2xl mx-auto mb-4">
                        <i className="fa-solid fa-bullseye"></i>
                      </div>
                      <h3 className="text-lg font-bold text-slate-800">No active goals</h3>
                      <p className="text-slate-500 text-sm max-w-sm mx-auto mt-1 mb-6">
                        {archivedCount > 0
                          ? `All goals are currently archived. Create a new goal or restore an archived goal.`
                          : `Define your first goal to begin planning and collaborating with your LLM advisor.`}
                      </p>
                      <div className="flex items-center justify-center gap-3">
                        <button
                          onClick={() => setShowNewGoalModal(true)}
                          className="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-medium text-sm inline-flex items-center space-x-2 shadow"
                        >
                          <i className="fa-solid fa-plus"></i>
                          <span>Create New Goal</span>
                        </button>
                        {archivedCount > 0 && (
                          <button
                            onClick={() => switchView('archive')}
                            className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium text-sm inline-flex items-center space-x-2 transition"
                          >
                            <i className="fa-solid fa-box-archive"></i>
                            <span>View Archive</span>
                          </button>
                        )}
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {tree.map(node => (
                        <NodeItem 
                          key={node.id} 
                          node={node}
                          allNodes={graphData.nodes}
                          readinessMap={graphData.readiness} 
                          onExport={(n) => setExportModalNode(n)}
                          onToggleStatus={handleToggleStatus}
                          onDelete={handleDeleteNode}
                          onAddEvidence={(n) => setEvidenceModalNode(n)}
                          onArchive={handleArchiveGoal}
                          onRefreshGraph={loadGraph}
                          onAddChild={handleOpenAddChild}
                          showToast={showToast}
                        />
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* New Goal Modal */}
          {showNewGoalModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                  <div className="flex items-center space-x-1.5">
                    <h3 className="text-lg font-bold text-slate-900">Create New Goal</h3>
                    <ContextHelpButton
                      title="Goal Creation"
                      summary="Goals are top-level desired outcomes that anchor milestone roadmaps and actionable task trees."
                      termId="goal"
                      topicId="goals-and-actions"
                    />
                  </div>
                  <button onClick={() => setShowNewGoalModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>
                <form onSubmit={handleCreateGoal} className="mt-4 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Goal Title</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="e.g. Launch SaaS Product MVP"
                      value={newGoalTitle}
                      onChange={(e) => setNewGoalTitle(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Description / Target Outcome</label>
                    <textarea 
                      rows="3" 
                      placeholder="Describe what success looks like..."
                      value={newGoalDesc}
                      onChange={(e) => setNewGoalDesc(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setShowNewGoalModal(false)} 
                      className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 text-sm bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium shadow"
                    >
                      Create Goal
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Ask AI & Export Context Modal */}
          {exportModalNode && (
            <ExportModal 
              node={exportModalNode} 
              allNodes={graphData.nodes || []}
              workspaceId={currentWorkspaceId}
              onClose={() => setExportModalNode(null)} 
              onSuccess={() => {
                setExportModalNode(null);
                loadGraph();
              }}
              showToast={showToast}
            />
          )}

          {/* Import Proposal Modal */}
          {showImportModal && (
            <ImportModal 
              allNodes={graphData.nodes || []}
              workspaceId={currentWorkspaceId}
              onClose={() => setShowImportModal(false)}
              onSuccess={() => {
                setShowImportModal(false);
                loadGraph();
              }}
              showToast={showToast}
            />
          )}

          {/* Agent Setup Modal */}
          {showAgentSetupModal && (
            <AgentSetupModal onClose={() => setShowAgentSetupModal(false)} showToast={showToast} />
          )}

          {/* Error Log Telemetry Modal (ADR 0019) */}
          {showErrorModal && (
            <ErrorLogModal 
              onClose={() => setShowErrorModal(false)} 
              onStatusChange={refreshErrorCount} 
            />
          )}

          {/* Add Evidence / Note Modal */}
          {evidenceModalNode && (
            <AddEvidenceModal 
              node={evidenceModalNode}
              onClose={() => setEvidenceModalNode(null)}
              onSuccess={() => {
                setEvidenceModalNode(null);
                loadGraph();
              }}
              showToast={showToast}
            />
          )}

          {/* Add Child Node Modal (Milestones, Actions, Steps) */}
          {addChildModal.isOpen && addChildModal.parentNode && (
            <AddChildNodeModal
              workspaceId={currentWorkspaceId}
              parentNode={addChildModal.parentNode}
              defaultType={addChildModal.defaultType}
              onClose={() => setAddChildModal({ isOpen: false, parentNode: null, defaultType: 'milestone' })}
              onSuccess={() => {
                setAddChildModal({ isOpen: false, parentNode: null, defaultType: 'milestone' });
                loadGraph();
              }}
              showToast={showToast}
            />
          )}

          {/* Help and Domain Glossary Modal */}
          <HelpModal 
            isOpen={helpModalConfig.isOpen}
            onClose={() => setHelpModalConfig(prev => ({ ...prev, isOpen: false }))}
            initialTab={helpModalConfig.tab}
            targetId={helpModalConfig.targetId}
          />

          {/* Toast Message (Always on top with z-[9999]) */}
          {toast && (
            <div className={`fixed bottom-6 right-6 px-4 py-3 rounded-xl shadow-2xl border text-sm font-medium flex items-center space-x-2 z-[9999] transition-all ${
              toast.type === 'error' ? 'bg-red-50 text-red-900 border-red-300 ring-2 ring-red-400' : 
              toast.type === 'info' ? 'bg-blue-50 text-blue-900 border-blue-200' : 
              'bg-emerald-50 text-emerald-900 border-emerald-200'
            }`}>
              <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation text-red-600' : 'fa-circle-check text-emerald-600'}`}></i>
              <span>{toast.msg}</span>
            </div>
          )}
        </div>
        </HelpContext.Provider>
      );
    }

    // Node Item Recursive Component
    function NodeItem({ node, allNodes = [], readinessMap, onExport, onToggleStatus, onDelete, onAddEvidence, onArchive, onUnarchive, onRefreshGraph, onAddChild, showToast }) {
      const [collapsed, setCollapsed] = useState(false);
      const [showEvidence, setShowEvidence] = useState(true);
      const readinessInfo = readinessMap?.[node.id];
      const isBlocked = readinessInfo?.readiness === 'blocked';
      const evidenceList = node.evidence || [];
      const evidenceCount = evidenceList.length;
      const isMilestone = node.type === 'milestone';

      // Subtree progress for container nodes with children
      const nodeProgress = useMemo(() => {
        if (node.children && node.children.length > 0) {
          return computeNodeProgress(node, allNodes);
        }
        return null;
      }, [node, allNodes]);

      // Resolve human-readable blocker titles for tooltips
      const blockerTitles = useMemo(() => {
        if (!isBlocked) return [];
        if (readinessInfo?.blockingNodeTitles && readinessInfo.blockingNodeTitles.length > 0) {
          return readinessInfo.blockingNodeTitles;
        }
        return (readinessInfo?.blockingNodeIds || []).map(id => {
          const blocker = allNodes.find(n => n.id === id);
          return blocker?.title || id;
        });
      }, [isBlocked, readinessInfo, allNodes]);

      const handleDeleteEvidence = async (evId) => {
        try {
          const res = await fetch(`/api/evidence/${evId}`, { method: 'DELETE' });
          if (res.ok) {
            showToast('Note removed');
            if (onRefreshGraph) onRefreshGraph();
          } else {
            showToast('Failed to delete note', 'error');
          }
        } catch {
          showToast('Failed to delete note', 'error');
        }
      };

      // Type styling
      const typeStyles = {
        goal: 'bg-indigo-100 text-indigo-800 border-indigo-200',
        sub_goal: 'bg-blue-100 text-blue-800 border-blue-200',
        milestone: 'bg-purple-100 text-purple-800 border-purple-200',
        action: 'bg-sky-100 text-sky-800 border-sky-200',
        sub_action: 'bg-slate-100 text-slate-800 border-slate-200',
      };

      // Status styling
      const statusStyles = {
        todo: 'bg-slate-100 text-slate-700 hover:bg-slate-200',
        in_progress: 'bg-amber-100 text-amber-800 hover:bg-amber-200',
        done: 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200',
        abandoned: 'bg-rose-100 text-rose-800',
      };

      return (
        <div className={`border rounded-xl p-3 transition ${
          isMilestone 
            ? 'border-purple-300 bg-purple-50/25 hover:border-purple-400 shadow-2xs ring-1 ring-purple-200/50' 
            : node.type === 'goal'
            ? 'border-indigo-200 bg-slate-50/70 hover:border-indigo-300 shadow-2xs'
            : 'border-slate-200 bg-slate-50/50 hover:border-slate-300'
        }`}>
          <div className="flex items-center justify-between gap-3">
            <div className="flex items-center space-x-2.5 flex-1 min-w-0">
              {node.children.length > 0 ? (
                <button onClick={() => setCollapsed(!collapsed)} className="text-slate-400 hover:text-slate-600 w-5 text-center shrink-0">
                  <i className={`fa-solid fa-chevron-${collapsed ? 'right' : 'down'} text-xs`}></i>
                </button>
              ) : (
                <span className="w-5 text-slate-300 text-center shrink-0">•</span>
              )}

              {/* Status toggle button */}
              <button 
                onClick={() => onToggleStatus(node)}
                title="Click to advance status"
                className={`px-2 py-0.5 rounded text-xs font-semibold border transition shrink-0 whitespace-nowrap ${statusStyles[node.status]}`}
              >
                {node.status.replace('_', ' ')}
              </button>
              <ContextHelpButton
                title="Node Status"
                summary="Explicit execution intent (todo, in_progress, done, abandoned). Click the status pill to cycle states."
                termId="status"
                topicId="goals-and-actions"
              />

              {/* Type Badge */}
              <span className={`px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider border flex items-center space-x-1 shrink-0 whitespace-nowrap ${typeStyles[node.type]}`}>
                {isMilestone && <i className="fa-solid fa-flag text-[10px] text-purple-600 mr-1"></i>}
                {node.type === 'goal' && <i className="fa-solid fa-bullseye text-[10px] text-indigo-600 mr-1"></i>}
                <span>{node.type.replace('_', ' ')}</span>
              </span>
              <ContextHelpButton
                title={`${node.type.replace('_', ' ')} Node`}
                summary={`A ${node.type.replace('_', ' ')} in the plan containment tree.`}
                termId={node.type === 'goal' ? 'goal' : node.type === 'milestone' ? 'milestone' : node.type === 'action' ? 'action' : 'sub-action'}
                topicId="goals-and-actions"
              />

              {/* Title & Description - Separate lines so description never cuts off the title */}
              <div className="flex-1 min-w-0 flex flex-col justify-center">
                <div className="flex items-center space-x-2 min-w-0">
                  {isMilestone && (
                    <span className="text-[10px] font-bold px-1.5 py-0.5 bg-purple-100 text-purple-700 rounded border border-purple-200 shrink-0">
                      Phase Gate
                    </span>
                  )}
                  <span 
                    title={node.title}
                    className={`font-semibold text-sm truncate ${node.status === 'done' ? 'line-through text-slate-400' : isMilestone ? 'text-purple-950 font-bold' : 'text-slate-900'}`}
                  >
                    {node.title}
                  </span>
                </div>
                {node.description && (
                  <p 
                    title={node.description}
                    className="text-xs text-slate-500 font-normal truncate mt-0.5 leading-snug"
                  >
                    {node.description}
                  </p>
                )}
              </div>

              {/* Subtree Progress: Mini Ring for Goal Nodes, Linear Pill for other container nodes */}
              {nodeProgress && node.type === 'goal' ? (
                <div className="hidden sm:inline-flex items-center shrink-0">
                  <MiniProgressRing percentage={nodeProgress.percentage} />
                </div>
              ) : nodeProgress ? (
                <div 
                  className="hidden sm:flex items-center space-x-1.5 px-2 py-0.5 rounded-full bg-slate-100 border border-slate-200 text-[11px] font-semibold text-slate-700 shrink-0"
                  title={`${nodeProgress.completed} of ${nodeProgress.total} items completed in subtree`}
                >
                  <div className="w-8 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                    <div 
                      className={`h-full rounded-full transition-all duration-300 ${
                        nodeProgress.percentage === 100 ? 'bg-emerald-500' : 'bg-brand-500'
                      }`}
                      style={{ width: `${nodeProgress.percentage}%` }}
                    />
                  </div>
                  <span className="font-mono text-[10px]">{nodeProgress.percentage}%</span>
                </div>
              ) : null}

              {/* Dynamic Readiness Badge (ADR 0003) */}
              {isBlocked && (
                <div className="flex items-center space-x-1 shrink-0">
                  <span 
                    className="px-2 py-0.5 bg-rose-50 text-rose-700 border border-rose-200 rounded text-xs font-medium flex items-center space-x-1 cursor-help whitespace-nowrap" 
                    title={blockerTitles.length > 0 ? `Blocked by: ${blockerTitles.join(', ')}` : 'Blocked by prerequisites'}
                  >
                    <i className="fa-solid fa-lock text-[10px]"></i>
                    <span>Blocked</span>
                  </span>
                  <ContextHelpButton
                    title="Blocked Readiness"
                    summary={blockerTitles.length > 0 ? `Waiting on prerequisites: ${blockerTitles.join(', ')}` : 'Waiting on incomplete prerequisite dependencies.'}
                    termId="readiness"
                    topicId="dependencies-readiness"
                  />
                </div>
              )}

              {/* Evidence / Note Count Pill */}
              {evidenceCount > 0 && (
                <button
                  type="button"
                  onClick={() => setShowEvidence(!showEvidence)}
                  title={`${showEvidence ? 'Hide' : 'Show'} ${evidenceCount} attached notes/evidence`}
                  className="px-2 py-0.5 rounded text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-300 hover:bg-amber-100 flex items-center space-x-1 transition shrink-0 whitespace-nowrap"
                >
                  <i className="fa-regular fa-note-sticky text-[10px]"></i>
                  <span>{evidenceCount}</span>
                </button>
              )}
            </div>

            {/* Actions */}
            <div className="flex items-center space-x-1 shrink-0">
              {/* Quick 1-Click Child Authoring (ADR 0001, ADR 0004) */}
              {(node.type === 'goal' || node.type === 'sub_goal') && (
                <>
                  <button 
                    onClick={() => onAddChild && onAddChild(node, 'milestone')} 
                    title="Add sequential milestone under this goal"
                    className="px-2.5 py-1 text-xs font-semibold bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg flex items-center space-x-1 border border-purple-200 transition shadow-2xs"
                  >
                    <i className="fa-solid fa-flag text-[10px]"></i>
                    <span>+ Milestone</span>
                  </button>
                  <button 
                    onClick={() => onAddChild && onAddChild(node, 'action')} 
                    title="Add action directly under this goal"
                    className="px-2 py-1 text-xs font-medium bg-sky-50 hover:bg-sky-100 text-sky-700 rounded-lg flex items-center space-x-1 border border-sky-200 transition shadow-2xs"
                  >
                    <i className="fa-solid fa-plus text-[10px]"></i>
                    <span>Action</span>
                  </button>
                </>
              )}

              {node.type === 'milestone' && (
                <button 
                  onClick={() => onAddChild && onAddChild(node, 'action')} 
                  title="Add action under this milestone"
                  className="px-2.5 py-1 text-xs font-semibold bg-sky-50 hover:bg-sky-100 text-sky-700 rounded-lg flex items-center space-x-1 border border-sky-200 transition shadow-2xs"
                >
                  <i className="fa-solid fa-plus text-[10px]"></i>
                  <span>+ Action</span>
                </button>
              )}

              {(node.type === 'action' || node.type === 'sub_action') && (
                <button 
                  onClick={() => onAddChild && onAddChild(node, 'sub_action')} 
                  title="Add sub-action step under this action"
                  className="px-2 py-1 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg flex items-center space-x-1 border border-slate-200 transition shadow-2xs"
                >
                  <i className="fa-solid fa-plus text-[10px]"></i>
                  <span>+ Step</span>
                </button>
              )}

              <button 
                onClick={() => onAddEvidence && onAddEvidence(node)} 
                title="Add note or information to this node"
                className="px-2 py-1 text-xs font-medium bg-amber-50 hover:bg-amber-100 text-amber-800 rounded-lg flex items-center space-x-1 border border-amber-200 transition"
              >
                <i className="fa-solid fa-plus text-[10px]"></i>
                <span className="hidden sm:inline">Note</span>
              </button>

              <button 
                onClick={() => onExport(node)} 
                title="Export context to LLM"
                className="px-2.5 py-1 text-xs font-medium bg-brand-50 hover:bg-brand-100 text-brand-700 rounded-lg flex items-center space-x-1 border border-brand-200 transition"
              >
                <i className="fa-solid fa-paper-plane text-[10px]"></i>
                <span>Ask AI</span>
              </button>

              {/* Archive Goal button (for completed active goals) */}
              {node.type === 'goal' && !node.archivedAt && node.status === 'done' && (
                <button 
                  onClick={() => onArchive && onArchive(node.id)} 
                  title="Archive completed goal (moves out of active scope and analytics)"
                  className="px-2.5 py-1 text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg flex items-center space-x-1 border border-indigo-200 transition shadow-2xs"
                >
                  <i className="fa-solid fa-box-archive text-[10px]"></i>
                  <span>Archive</span>
                </button>
              )}

              {/* Restore Goal button (for archived goals) */}
              {node.type === 'goal' && !!node.archivedAt && (
                <button 
                  onClick={() => onUnarchive && onUnarchive(node.id)} 
                  title="Restore goal to active plan"
                  className="px-2.5 py-1 text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-lg flex items-center space-x-1 border border-emerald-200 transition shadow-2xs"
                >
                  <i className="fa-solid fa-rotate-left text-[10px]"></i>
                  <span>Restore</span>
                </button>
              )}

              <button 
                onClick={() => onDelete(node.id)}
                className="text-slate-400 hover:text-red-600 p-1.5 rounded transition"
                title="Delete node"
              >
                <i className="fa-solid fa-trash text-xs"></i>
              </button>
            </div>
          </div>

          {/* Attached Evidence & Notes list */}
          {showEvidence && evidenceCount > 0 && (
            <div className="mt-2.5 pt-2.5 border-t border-slate-200/60 pl-6 space-y-2">
              <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center justify-between">
                <span className="flex items-center space-x-1">
                  <i className="fa-regular fa-note-sticky text-amber-600"></i>
                  <span>Attached Notes & Evidence ({evidenceCount})</span>
                </span>
                <button 
                  onClick={() => onAddEvidence && onAddEvidence(node)} 
                  className="text-amber-700 hover:text-amber-800 font-semibold normal-case text-xs flex items-center space-x-1"
                >
                  <i className="fa-solid fa-plus text-[10px]"></i>
                  <span>Add note</span>
                </button>
              </div>
              <div className="space-y-1.5">
                {evidenceList.map(ev => (
                  <div key={ev.id} className="bg-white border border-amber-200/80 rounded-xl p-2.5 text-xs shadow-sm relative group">
                    <div className="flex items-start justify-between gap-2">
                      <p className="text-slate-800 whitespace-pre-wrap flex-1 leading-relaxed">{ev.content}</p>
                      <button 
                        onClick={() => handleDeleteEvidence(ev.id)}
                        title="Delete note"
                        className="text-slate-400 hover:text-rose-600 p-1 rounded transition opacity-0 group-hover:opacity-100"
                      >
                        <i className="fa-solid fa-trash-can text-xs"></i>
                      </button>
                    </div>
                    <div className="flex flex-wrap items-center gap-2 mt-2 pt-1.5 border-t border-slate-100 text-[10px] text-slate-500">
                      <span className={`px-1.5 py-0.5 rounded font-semibold ${
                        ev.addedBy === 'user' ? 'bg-amber-100 text-amber-800' : 'bg-brand-100 text-brand-800'
                      }`}>
                        {ev.addedBy === 'user' ? 'User Note' : 'LLM Evidence'}
                      </span>
                      {ev.confidence && (
                        <span className={`px-1.5 py-0.5 rounded font-semibold uppercase ${
                          ev.confidence === 'high' ? 'bg-emerald-100 text-emerald-800' :
                          ev.confidence === 'medium' ? 'bg-yellow-100 text-yellow-800' : 'bg-slate-100 text-slate-700'
                        }`}>
                          {ev.confidence}
                        </span>
                      )}
                      {ev.sourceUrl && (
                        <a 
                          href={ev.sourceUrl} 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          className="text-brand-600 hover:underline flex items-center space-x-1 truncate max-w-xs"
                        >
                          <i className="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                          <span className="truncate">{ev.sourceTitle || ev.sourceUrl}</span>
                        </a>
                      )}
                      <span className="text-slate-400 ml-auto">
                        {new Date(ev.retrievedAt).toLocaleDateString()}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Children */}
          {!collapsed && node.children.length > 0 && (
            <div className="pl-6 pt-3 space-y-2 border-l-2 border-slate-200 ml-3.5 mt-2">
              {node.children.map(child => (

                  onToggleStatus={onToggleStatus}

                  onRefreshGraph={onRefreshGraph}
                  onAddChild={onAddChild}

    function AddChildNodeModal({ workspaceId, parentNode, defaultType = 'milestone', onClose, onSuccess, showToast }) {

      const [inputs, setInputs] = useState('');
      const [expectedOutputs, setExpectedOutputs] = useState('');

      // Determine valid child types based on parent type (ADR 0001, ADR 0004)
      const allowedTypes = useMemo(() => {
        if (!parentNode) return [];
        if (parentNode.type === 'goal' || parentNode.type === 'sub_goal') {
          return [
            { type: 'milestone', label: 'Milestone (Major Checkpoint / Phase Gate)', icon: 'fa-flag', color: 'text-purple-600' },
            { type: 'action', label: 'Action (Direct Executable Task)', icon: 'fa-bolt', color: 'text-sky-600' },
            { type: 'sub_goal', label: 'Sub-Goal (Nested Strategic Objective)', icon: 'fa-bullseye', color: 'text-blue-600' },

        if (parentNode.type === 'milestone') {
          return [
            { type: 'action', label: 'Action (Executable Task within Milestone)', icon: 'fa-bolt', color: 'text-sky-600' },
          ];

        if (parentNode.type === 'action' || parentNode.type === 'sub_action') {
          return [
            { type: 'sub_action', label: 'Sub-action / Step (Detailed Executable Step)', icon: 'fa-list-check', color: 'text-slate-600' },
          ];
        }
        return [];
      }, [parentNode]);

                    <label className="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">

                      className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />

                </div>
              )}

              <div className="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium"
