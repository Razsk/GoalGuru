    // Ask AI & Import Proposal Unified Workflow Modal (ADR 0007, 0008, 0013, 0005, 0012)
    function AskAIWorkflowModal({ initialStep = 1, node: initialNode, allNodes = [], workspaceId, onClose, onSuccess, showToast }) {
      const [step, setStep] = useState(initialStep);
      const [selectedNodeId, setSelectedNodeId] = useState(initialNode?.id || (allNodes.length > 0 ? allNodes[0].id : ''));

      // If initialNode changes or wasn't set, resolve currentNode
      const currentNode = useMemo(() => {
        if (initialNode && (!selectedNodeId || initialNode.id === selectedNodeId)) return initialNode;
        return allNodes.find(n => n.id === selectedNodeId) || initialNode || (allNodes.length > 0 ? allNodes[0] : null);
      }, [initialNode, selectedNodeId, allNodes]);

      // Step 1: Export Context State
      const [requestMode, setRequestMode] = useState('create_plan');
      const [userNote, setUserNote] = useState('');
      const [generatedPrompt, setGeneratedPrompt] = useState('');
      const [copied, setCopied] = useState(false);
      const [loadingPrompt, setLoadingPrompt] = useState(false);

      // Step 2: Import Proposal State
      const [rawText, setRawText] = useState('');
      const [parsedProposal, setParsedProposal] = useState(null);
      const [selectedKeys, setSelectedKeys] = useState(new Set());
      const [analyzing, setAnalyzing] = useState(false);
      const [committing, setCommitting] = useState(false);
      const [commitError, setCommitError] = useState(null);

      // Fetch prompt for Step 1
      const fetchPrompt = async () => {
        if (!currentNode) return;
        setLoadingPrompt(true);
        try {
          const res = await fetch(`/api/workspaces/${workspaceId}/export`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              focusNodeId: currentNode.id,
              requestMode,
              userNote
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to generate prompt');
          setGeneratedPrompt(data.prompt);
        } catch (err) {
          showToast(err.message || 'Failed to generate prompt', 'error');
        } finally {
          setLoadingPrompt(false);
        }
      };

      useEffect(() => {
        if (currentNode) {
          fetchPrompt();
        }
      }, [requestMode, currentNode?.id]);

      const handleCopy = () => {
        if (!generatedPrompt) return;
        navigator.clipboard.writeText(generatedPrompt);
        setCopied(true);
        showToast('Prompt copied to clipboard! Paste into your LLM advisor.');
        setTimeout(() => setCopied(false), 3000);
      };

      // Step 2: Paste from clipboard helper
      const handlePasteFromClipboard = async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text && text.trim()) {
              setRawText(text);
              showToast('Pasted text from clipboard!');
              return;
            }
          }
          showToast('Clipboard is empty or browser access denied. Please paste manually.', 'info');
        } catch (e) {
          showToast('Clipboard access denied by browser. Please paste using Ctrl+V.', 'info');
        }
      };

      // Step 2: Analyze LLM proposal
      const handleAnalyze = async () => {
        if (!rawText.trim()) return;
        setAnalyzing(true);
        setCommitError(null);
        try {
          const res = await fetch(`/api/workspaces/${workspaceId}/parse-proposal`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rawText })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to parse proposal');

          setParsedProposal(data);

          // Select all mutations by default
          const keys = new Set();
          (data.changeSet || []).forEach((m, idx) => {
            const key = m.tempId || m.nodeId || `mut_${idx}`;
            keys.add(key);
          });
          setSelectedKeys(keys);
          showToast('Proposal parsed successfully!');
        } catch (err) {
          showToast(err.message || 'Failed to parse proposal', 'error');
        } finally {
          setAnalyzing(false);
        }
      };

      // Step 2: Toggle mutation key with cascade deselection (ADR 0005)
      const toggleMutationKey = (key) => {
        const next = new Set(selectedKeys);
        if (next.has(key)) {
          next.delete(key);
          // Auto cascade: remove any sub-action that had this node as parent
          (parsedProposal?.changeSet || []).forEach(m => {
            if (m.type === 'create_node' && m.parentId === key) {
              const childKey = m.tempId || m.nodeId;
              if (childKey) next.delete(childKey);
            }
          });
        } else {
          next.add(key);
        }
        setSelectedKeys(next);
      };

      const handleSelectAll = () => {
        if (!parsedProposal?.changeSet) return;
        const keys = new Set();
        parsedProposal.changeSet.forEach((m, idx) => {
          const key = m.tempId || m.nodeId || `mut_${idx}`;
          keys.add(key);
        });
        setSelectedKeys(keys);
      };

      const handleDeselectAll = () => {
        setSelectedKeys(new Set());
      };

      // Step 2: Commit proposal mutations
      const handleCommit = async () => {
        if (!parsedProposal) return;
        setCommitting(true);
        setCommitError(null);
        try {
          const activeMutations = (parsedProposal.changeSet || []).filter((m, idx) => {
            const key = m.tempId || m.nodeId || `mut_${idx}`;
            return selectedKeys.has(key);
          });

          const res = await fetch(`/api/workspaces/${workspaceId}/commit-proposal`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              baseStateVersion: parsedProposal.stateVersion,
              adviceSummary: parsedProposal.advice?.summary,
              selectedMutations: activeMutations
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || data.message || 'Commit failed');

          showToast(`Applied ${activeMutations.length} mutations! Plan advanced to v${data.newStateVersion}`);
          if (onSuccess) {
            onSuccess();
          } else {
            onClose();
          }
        } catch (err) {
          setCommitError(err.message || 'Commit failed');
          showToast(err.message || 'Commit failed', 'error');
        } finally {
          setCommitting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl border border-slate-200 max-h-[92vh] flex flex-col">
            
            {/* Modal Header */}
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-brand-50 border border-brand-200 flex items-center justify-center text-brand-600 text-lg shadow-2xs">
                  <i className="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h3 className="text-lg font-bold text-slate-900">Ask AI & Import Proposal</h3>
                    <ContextHelpButton
                      title="Ask AI & Proposal Exchange"
                      summary="Dual-stage AI exchange: export bounded causal subgraphs, consult your LLM advisor, and import structured proposals back into authoritative local state."
                      termId="proposal"
                      topicId="proposals-exchange"
                    />
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">
                    {currentNode ? (
                      <span>Focused on: <span className="font-semibold text-slate-700">{currentNode.title}</span> <span className="text-[11px] uppercase tracking-wider font-semibold text-brand-600 ml-1">({currentNode.type})</span></span>
                    ) : (
                      <span>Workspace-wide proposal exchange</span>
                    )}
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg transition" title="Close dialog">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            {/* Workflow Step Navigation Tabs */}
            <div className="flex items-center justify-between bg-slate-100/80 p-1 rounded-xl border border-slate-200 my-3">
              <button
                type="button"
                onClick={() => setStep(1)}
                className={`flex-1 py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center space-x-2 transition ${
                  step === 1 
                    ? 'bg-white text-brand-700 shadow-xs border border-slate-200/60 font-bold' 
                    : 'text-slate-600 hover:text-slate-900 hover:bg-white/50'
                }`}
              >
                <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${
                  step === 1 ? 'bg-brand-600 text-white' : copied ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'
                }`}>
                  {copied ? <i className="fa-solid fa-check text-[9px]"></i> : '1'}
                </span>
                <span>1. Export Context to LLM</span>
              </button>

              <div className="text-slate-300 px-1 text-xs">
                <i className="fa-solid fa-chevron-right"></i>
              </div>

              <button
                type="button"
                onClick={() => setStep(2)}
                className={`flex-1 py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center space-x-2 transition ${
                  step === 2 
                    ? 'bg-white text-emerald-700 shadow-xs border border-slate-200/60 font-bold' 
                    : 'text-slate-600 hover:text-slate-900 hover:bg-white/50'
                }`}
              >
                <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${
                  step === 2 ? 'bg-emerald-600 text-white' : parsedProposal ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'
                }`}>
                  {parsedProposal ? <i className="fa-solid fa-check text-[9px]"></i> : '2'}
                </span>
                <span>2. Import & Review Proposal</span>
                {parsedProposal && (
                  <span className="px-1.5 py-0.5 text-[10px] bg-emerald-100 text-emerald-800 rounded-full font-bold ml-1">
                    {parsedProposal.changeSet?.length || 0} changes
                  </span>
                )}
              </button>
            </div>

            {/* STEP 1: EXPORT PROMPT & CONTEXT */}
            {step === 1 && (
              <div className="space-y-4 flex-1 overflow-y-auto custom-scrollbar pr-1">
                {/* Optional Node Switcher if multiple nodes exist */}
                {!initialNode && allNodes.length > 0 && (
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                      Target Graph Node
                    </label>
                    <select
                      value={selectedNodeId}
                      onChange={(e) => setSelectedNodeId(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white"
                    >
                      {allNodes.map(n => (
                        <option key={n.id} value={n.id}>
                          [{n.type.toUpperCase()}] {n.title}
                        </option>
                      ))}
                    </select>
                  </div>
                )}

                {/* Request Mode Selection */}
                <div>
                  <div className="flex items-center space-x-1.5 mb-1.5">
                    <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
                      Request Mode (Intent)
                    </label>
                    <ContextHelpButton
                      title="Request Modes"
                      summary="Specifies the objective: create_plan (decompose), action_assistance (step advice), report_progress (mark done), or replan (resolve bottlenecks)."
                      termId="request-mode"
                      topicId="request-modes"
                    />
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {[
                      { id: 'create_plan', label: 'Create Plan', icon: 'fa-sitemap', desc: 'Decompose into milestones & tasks' },
                      { id: 'action_assistance', label: 'Action Assist', icon: 'fa-lightbulb', desc: 'Step advice & research (no edits)' },
                      { id: 'report_progress', label: 'Report Progress', icon: 'fa-check-double', desc: 'Log notes & mark tasks done' },
                      { id: 'replan', label: 'Replan', icon: 'fa-arrows-rotate', desc: 'Reroute around blockers & delays' },
                    ].map(mode => (
                      <button
                        key={mode.id}
                        type="button"
                        onClick={() => setRequestMode(mode.id)}
                        className={`p-2.5 rounded-xl border text-xs font-medium flex flex-col items-center text-center space-y-1 transition ${
                          requestMode === mode.id 
                            ? 'bg-brand-50 border-brand-500 text-brand-700 font-bold shadow-sm' 
                            : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <i className={`fa-solid ${mode.icon} text-base`}></i>
                        <span>{mode.label}</span>
                        <span className={`text-[10px] leading-tight line-clamp-2 ${requestMode === mode.id ? 'text-brand-600' : 'text-slate-400'}`}>
                          {mode.desc}
                        </span>
                      </button>
                    ))}
                  </div>

                  {/* Mode Purpose & Contract Callout */}
                  <div className="mt-2 p-2.5 bg-slate-50 border border-slate-200/80 rounded-xl text-[11px] text-slate-600 flex items-start space-x-2">
                    <i className="fa-solid fa-circle-info text-brand-500 mt-0.5 text-xs shrink-0"></i>
                    <div>
                      {requestMode === 'create_plan' && (
                        <span><strong className="text-slate-700">Create Plan:</strong> Deconstructs the focus node into sequential milestones and actions with explicit dependencies. Expected output: rich <code className="bg-slate-200/60 px-1 py-0.5 rounded text-[10px]">create_node</code> and <code className="bg-slate-200/60 px-1 py-0.5 rounded text-[10px]">add_dependency</code> mutations.</span>
                      )}
                      {(requestMode === 'action_assistance' || requestMode === 'task_assistance') && (
                        <span><strong className="text-slate-700">Action Assist:</strong> Provides deep execution guidance, research, and technical advice in <code className="bg-slate-200/60 px-1 py-0.5 rounded text-[10px]">advice</code>. Graph structure is preserved (no node creations or status updates).</span>
                      )}
                      {requestMode === 'report_progress' && (
                        <span><strong className="text-slate-700">Report Progress:</strong> Reconciles your work notes below against in-progress tasks, updating completed tasks to <code className="bg-slate-200/60 px-1 py-0.5 rounded text-[10px]">status: 'done'</code> and attaching outcomes as evidence.</span>
                      )}
                      {requestMode === 'replan' && (
                        <span><strong className="text-slate-700">Replan:</strong> Detaches stalled dependencies and constructs alternate pathways for blocked tasks. Completed work is strictly preserved.</span>
                      )}
                    </div>
                  </div>
                </div>

                {/* Optional User Note */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                    Optional Instructions for LLM
                  </label>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="e.g. Focus on low-cost options, or break into 3 small steps..."
                      value={userNote}
                      onChange={(e) => setUserNote(e.target.value)}
                      className="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                    <button 
                      onClick={fetchPrompt}
                      disabled={loadingPrompt}
                      className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition flex items-center space-x-1"
                    >
                      <i className={`fa-solid fa-arrows-rotate ${loadingPrompt ? 'animate-spin' : ''}`}></i>
                      <span>Refresh</span>
                    </button>
                  </div>
                </div>

                {/* Prompt Preview */}
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <div className="flex items-center space-x-1.5">
                      <span className="text-xs font-semibold text-slate-700 uppercase tracking-wider">
                        Clipboard Envelope Preview (Asymmetric Causal Path)
                      </span>
                      <ContextHelpButton
                        title="Asymmetric Causal Pruning"
                        summary="Full detail for the focus node, while collapsing ancestors and dependencies into compact skeletal markers to save context tokens."
                        termId="asymmetric-pruning"
                        topicId="request-modes"
                      />
                    </div>
                    <span className="text-[11px] text-slate-400">Contains boundary markers & passive framing</span>
                  </div>
                  <pre className="bg-slate-900 text-slate-100 p-3.5 rounded-xl text-xs font-mono overflow-x-auto max-h-52 custom-scrollbar whitespace-pre-wrap">
                    {loadingPrompt ? 'Generating causal context...' : (generatedPrompt || 'Select a node to generate prompt.')}
                  </pre>
                </div>

                {/* Step 1 Callout Banner */}
                {copied ? (
                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center justify-between text-xs text-emerald-900">
                    <div className="flex items-center space-x-2.5">
                      <i className="fa-solid fa-circle-check text-emerald-600 text-lg flex-shrink-0"></i>
                      <div>
                        <p className="font-bold">Prompt copied to clipboard!</p>
                        <p className="text-[11px] text-emerald-800">Paste it into ChatGPT, Claude, or Gemini. When it returns a proposal, click Continue to Import.</p>
                      </div>
                    </div>
                    <button 
                      onClick={() => setStep(2)}
                      className="ml-3 px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold text-xs flex items-center space-x-1.5 shadow-sm transition flex-shrink-0"
                    >
                      <span>Continue to Import</span>
                      <i className="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                  </div>
                ) : (
                  <div className="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-600 flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <i className="fa-solid fa-circle-info text-slate-400"></i>
                      <span>Copy this prompt, paste into your LLM advisor, then advance to Step 2 to import the response.</span>
                    </div>
                    <button 
                      onClick={() => setStep(2)}
                      className="text-brand-600 hover:text-brand-700 font-semibold text-xs flex items-center space-x-1 flex-shrink-0"
                    >
                      <span>Skip to Import</span>
                      <i className="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* STEP 2: IMPORT & REVIEW PROPOSAL */}
            {step === 2 && (
              <div className="space-y-4 flex-1 overflow-y-auto custom-scrollbar pr-1">
                {commitError && (
                  <div className="p-3.5 bg-red-50 border border-red-200 rounded-xl text-xs text-red-900 flex items-start space-x-2.5">
                    <i className="fa-solid fa-circle-exclamation text-red-600 mt-0.5 text-base flex-shrink-0"></i>
                    <div className="flex-1">
                      <p className="font-bold text-red-800">Proposal Commit Error</p>
                      <p className="font-mono text-xs mt-0.5 text-red-700">{commitError}</p>
                      <p className="text-[11px] text-slate-500 mt-1">This failure has been recorded in the database error telemetry.</p>
                    </div>
                  </div>
                )}

                {!parsedProposal ? (
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
                        LLM Proposal Envelope *
                      </label>
                      <button
                        type="button"
                        onClick={handlePasteFromClipboard}
                        className="text-xs text-brand-600 hover:text-brand-700 font-semibold flex items-center space-x-1"
                      >
                        <i className="fa-solid fa-paste"></i>
                        <span>Paste from Clipboard</span>
                      </button>
                    </div>
                    <textarea
                      rows="8"
                      placeholder="Paste full text containing ```goalguru-proposal ... ```"
                      value={rawText}
                      onChange={(e) => setRawText(e.target.value)}
                      className="w-full p-3 border border-slate-300 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500 custom-scrollbar"
                    />
                    <div className="flex items-center justify-between mt-2.5">
                      <span className="text-[11px] text-slate-500">
                        Supports full responses containing codeblocks or raw JSON.
                      </span>
                      <button
                        onClick={handleAnalyze}
                        disabled={analyzing || !rawText.trim()}
                        className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow flex items-center space-x-2 disabled:opacity-50 transition"
                      >
                        <i className={`fa-solid ${analyzing ? 'fa-spinner fa-spin' : 'fa-magnifying-glass'}`}></i>
                        <span>{analyzing ? 'Analyzing...' : 'Analyze Proposal'}</span>
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {/* Top status bar for parsed proposal */}
                    <div className="flex items-center justify-between bg-emerald-50 border border-emerald-200 px-3.5 py-2 rounded-xl text-xs text-emerald-900">
                      <div className="flex items-center space-x-2">
                        <i className="fa-solid fa-circle-check text-emerald-600 text-sm"></i>
                        <span className="font-semibold">Proposal parsed and ready for review</span>
                        <span className="text-slate-400">|</span>
                        <span className="text-[11px] text-emerald-700 font-mono">v{parsedProposal.stateVersion}</span>
                      </div>
                      <button
                        onClick={() => { setParsedProposal(null); setRawText(''); }}
                        className="text-xs text-emerald-800 hover:text-emerald-950 font-semibold flex items-center space-x-1"
                      >
                        <i className="fa-solid fa-rotate-left text-[10px]"></i>
                        <span>Paste different proposal</span>
                      </button>
                    </div>

                    {/* Collision Warning (ADR 0004) */}
                    {parsedProposal.hasCollision && (
                      <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 text-xs">
                        <p className="font-bold flex items-center space-x-1.5">
                          <i className="fa-solid fa-triangle-exclamation text-amber-600"></i>
                          <span>Touch-Set Collision Detected</span>
                          <ContextHelpButton
                            title="Touch-Set Collision"
                            summary="Local plan nodes modified since this proposal was exported. Review changes before committing to avoid overriding concurrent work."
                            termId="collision"
                            topicId="proposals-exchange"
                          />
                        </p>
                        <p className="mt-1">
                          Local changes occurred on nodes [{parsedProposal.collidingNodeIds?.join(', ')}] since this proposal was generated (Exported at v{parsedProposal.stateVersion}, Workspace currently at v{parsedProposal.currentWorkspaceVersion}). Please review checkboxes carefully.
                        </p>
                      </div>
                    )}

                    {/* Cycle Warning (ADR 0012) */}
                    {parsedProposal.hasCycle && (
                      <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-900 text-xs">
                        <p className="font-bold flex items-center space-x-1.5">
                          <i className="fa-solid fa-circle-exclamation text-red-600"></i>
                          <span>Circular Dependency Detected</span>
                          <ContextHelpButton
                            title="Cycle Invariant"
                            summary="Directed dependencies must not form closed circular loops (A → B → A). Deselect cyclic edges to proceed."
                            termId="cycle"
                            topicId="dependencies-readiness"
                          />
                        </p>
                        <p className="mt-1">
                          Cycle path: {parsedProposal.cycleNodes?.join(' → ')}. Cyclic edges should be unchecked.
                        </p>
                      </div>
                    )}

                    {/* Advisory Section (ADR 0008) */}
                    {parsedProposal.advice && (
                      <div className="p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-500">LLM Advisory Summary</span>
                        {parsedProposal.advice.summary && (
                          <p className="text-sm font-semibold text-slate-900">{parsedProposal.advice.summary}</p>
                        )}
                        {parsedProposal.advice.critique && (
                          <p className="text-xs text-slate-600"><strong className="text-slate-800">Critique:</strong> {parsedProposal.advice.critique}</p>
                        )}
                        {parsedProposal.advice.nextSteps && (
                          <p className="text-xs text-slate-600"><strong className="text-slate-800">Next Steps:</strong> {parsedProposal.advice.nextSteps}</p>
                        )}
                      </div>
                    )}

                    {/* Mutations Review Checklist */}
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-700">
                          Proposed Mutations ({parsedProposal.changeSet?.length || 0})
                        </span>
                        <div className="flex items-center space-x-2 text-[11px]">
                          <button
                            type="button"
                            onClick={handleSelectAll}
                            className="text-brand-600 hover:underline font-semibold"
                          >
                            Select All
                          </button>
                          <span className="text-slate-300">|</span>
                          <button
                            type="button"
                            onClick={handleDeselectAll}
                            className="text-slate-500 hover:underline"
                          >
                            Deselect All
                          </button>
                        </div>
                      </div>

                      <div className="space-y-2 max-h-56 overflow-y-auto custom-scrollbar pr-1">
                        {(parsedProposal.changeSet || []).map((m, idx) => {
                          const key = m.tempId || m.nodeId || `mut_${idx}`;
                          const isChecked = selectedKeys.has(key);

                          return (
                            <label 
                              key={idx} 
                              className={`flex items-start space-x-3 p-2.5 rounded-xl border text-xs cursor-pointer transition ${
                                isChecked ? 'bg-white border-emerald-300 shadow-sm' : 'bg-slate-50 border-slate-200 opacity-60'
                              }`}
                            >
                              <input 
                                type="checkbox" 
                                checked={isChecked}
                                onChange={() => toggleMutationKey(key)}
                                className="mt-0.5 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
                              />
                              <div className="flex-1">
                                <div className="flex items-center space-x-2">
                                  <span className="font-mono font-bold text-slate-800 uppercase text-[10px] bg-slate-100 px-1.5 py-0.5 rounded">
                                    {m.type?.replace('_', ' ')}
                                  </span>
                                  <span className="font-semibold text-slate-900">
                                    {m.title || m.nodeId || m.content || (m.fromNodeId && m.toNodeId ? `${m.fromNodeId} → ${m.toNodeId}` : 'Mutation')}
                                  </span>
                                </div>
                                {m.description && <p className="text-slate-500 text-[11px] mt-0.5">{m.description}</p>}
                              </div>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Modal Footer */}
            <div className="flex items-center justify-between pt-3 border-t border-slate-100 mt-3">
              {step === 1 ? (
                <div className="flex items-center space-x-2">
                  <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition">
                    Close
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setStep(1)}
                  className="px-3.5 py-2 text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition flex items-center space-x-1.5"
                >
                  <i className="fa-solid fa-arrow-left text-[10px]"></i>
                  <span>Back to Prompt (Step 1)</span>
                </button>
              )}

              <div className="flex items-center space-x-2">
                {step === 1 ? (
                  <>
                    <button 
                      onClick={handleCopy}
                      disabled={!generatedPrompt || loadingPrompt}
                      className="px-4 py-2 text-sm bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg font-medium shadow-2xs flex items-center space-x-2 transition disabled:opacity-50"
                    >
                      <i className={`fa-solid ${copied ? 'fa-check text-emerald-600' : 'fa-copy'}`}></i>
                      <span>{copied ? 'Copied!' : 'Copy to Clipboard'}</span>
                    </button>
                    <button 
                      onClick={() => setStep(2)}
                      className="px-5 py-2 text-sm bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium shadow flex items-center space-x-1.5 transition"
                    >
                      <span>Next: Import Proposal</span>
                      <i className="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                  </>
                ) : (
                  <>
                    <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition">
                      Cancel
                    </button>
                    {parsedProposal && (
                      <button 
                        onClick={handleCommit}
                        disabled={committing || selectedKeys.size === 0}
                        className="px-5 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold shadow flex items-center space-x-2 disabled:opacity-50 transition"
                      >
                        <i className={`fa-solid ${committing ? 'fa-spinner fa-spin' : 'fa-check'}`}></i>
                        <span>{committing ? 'Committing...' : `Commit ${selectedKeys.size} Changes to Plan`}</span>
                      </button>
                    )}
                  </>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ExportModal & ImportModal delegators for backward-compatibility
    function ExportModal(props) {
      return <AskAIWorkflowModal initialStep={1} {...props} />;
    }

    function ImportModal(props) {
      return <AskAIWorkflowModal initialStep={2} {...props} />;
    }

    // Agent Setup Modal (ADR 0017)
    function AgentSetupModal({ onClose, showToast }) {
      const [prompt, setPrompt] = useState('');
      const [copied, setCopied] = useState(false);
      const [activeTab, setActiveTab] = useState('prompt'); // 'prompt' | 'guides' | 'architecture'

      useEffect(() => {
        fetch('/api/agent-system-prompt')
          .then(r => r.json())
          .then(d => setPrompt(d.prompt))
          .catch(() => showToast('Failed to load system prompt', 'error'));
      }, []);

      const handleCopy = () => {
        navigator.clipboard.writeText(prompt);
        setCopied(true);
        showToast('System prompt copied to clipboard!');
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl border border-slate-200 flex flex-col max-h-[90vh]">
            {/* Header */}
            <div className="flex items-center justify-between pb-4 border-b border-slate-100">
              <div className="flex items-center space-x-2">
                <div className="w-9 h-9 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center text-lg">
                  <i className="fa-solid fa-robot"></i>
                </div>
                <div>
                  <h3 className="text-lg font-bold text-slate-900 flex items-center space-x-2">
                    <span>Configure Persistent Custom Agent</span>
                  </h3>
                  <p className="text-xs text-slate-500">
                    Set up ChatGPT, Claude Projects, or Gemini Gems as dedicated planning advisors (ADR 0017)
                  </p>
                </div>
                <ContextHelpButton
                  title="Dual Delivery Architecture"
                  summary="Goal Guru provisions system instructions for persistent custom agents (Custom GPTs, Claude Projects, Gems) so they strictly communicate via Goal Guru JSON proposals."
                  topicId="getting-started"
                  termId="proposal"
                  align="left"
                />
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg transition">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            {/* Navigation Tabs */}
            <div className="flex space-x-2 pt-3 border-b border-slate-100 text-xs font-semibold">
              <button
                onClick={() => setActiveTab('prompt')}
                className={`pb-2.5 px-3 border-b-2 flex items-center space-x-1.5 transition ${
                  activeTab === 'prompt'
                    ? 'border-brand-600 text-brand-600 font-bold'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <i className="fa-solid fa-terminal text-xs"></i>
                <span>Universal System Prompt</span>
              </button>

              <button
                onClick={() => setActiveTab('guides')}
                className={`pb-2.5 px-3 border-b-2 flex items-center space-x-1.5 transition ${
                  activeTab === 'guides'
                    ? 'border-brand-600 text-brand-600 font-bold'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <i className="fa-solid fa-compass text-xs"></i>
                <span>Platform Setup Guides</span>
              </button>

              <button
                onClick={() => setActiveTab('architecture')}
                className={`pb-2.5 px-3 border-b-2 flex items-center space-x-1.5 transition ${
                  activeTab === 'architecture'
                    ? 'border-brand-600 text-brand-600 font-bold'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <i className="fa-solid fa-diagram-project text-xs"></i>
                <span>How It Works (ADR 0017)</span>
              </button>
            </div>

            {/* Tab Content */}
            <div className="mt-4 flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-4">
              {activeTab === 'prompt' && (
                <div className="space-y-3">
                  <div className="bg-brand-50/60 border border-brand-200/80 rounded-xl p-3 text-xs text-brand-900 flex items-start space-x-2.5">
                    <i className="fa-solid fa-circle-info text-brand-600 mt-0.5 text-sm shrink-0"></i>
                    <div>
                      <p className="font-semibold">One prompt for all LLM platforms</p>
                      <p className="text-brand-800/90 mt-0.5 text-[11px] leading-relaxed">
                        Paste this system prompt into your persistent agent. Once configured, you can paste exported Goal Guru context slices into the agent without needing to repeatedly explain the protocol or envelope format.
                      </p>
                    </div>
                  </div>

                  <div className="relative">
                    <pre className="bg-slate-900 text-slate-100 p-4 rounded-xl text-xs font-mono overflow-x-auto max-h-80 custom-scrollbar whitespace-pre-wrap leading-relaxed">
                      {prompt}
                    </pre>
                    <button
                      onClick={handleCopy}
                      className="absolute top-3 right-3 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition shadow flex items-center space-x-1.5 border border-slate-700"
                    >
                      <i className={`fa-solid ${copied ? 'fa-check text-emerald-400' : 'fa-copy'}`}></i>
                      <span>{copied ? 'Copied!' : 'Copy'}</span>
                    </button>
                  </div>
                </div>
              )}

              {activeTab === 'guides' && (
                <div className="space-y-4 text-xs">
                  {/* ChatGPT Custom GPT */}
                  <div className="border border-slate-200 rounded-xl p-3.5 bg-slate-50/50 space-y-2">
                    <div className="flex items-center space-x-2 text-slate-900 font-bold">
                      <span className="w-5 h-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold">1</span>
                      <i className="fa-solid fa-comments text-emerald-600"></i>
                      <span>OpenAI ChatGPT — Custom GPT</span>
                    </div>
                    <ol className="list-decimal list-inside space-y-1 text-slate-600 pl-2">
                      <li>Go to <strong>ChatGPT</strong> ➔ <strong>Explore GPTs</strong> ➔ click <strong>+ Create</strong>.</li>
                      <li>Select the <strong>Configure</strong> tab.</li>
                      <li>Name it <code>Goal Guru Advisor</code> and add a description.</li>
                      <li>Paste the <strong>Universal System Prompt</strong> into the <strong>Instructions</strong> box.</li>
                      <li>Ensure <strong>Web Browsing</strong> is enabled for external research evidence.</li>
                      <li>Click <strong>Save / Publish</strong> (Only me).</li>
                    </ol>
                  </div>

                  {/* Claude Projects */}
                  <div className="border border-slate-200 rounded-xl p-3.5 bg-slate-50/50 space-y-2">
                    <div className="flex items-center space-x-2 text-slate-900 font-bold">
                      <span className="w-5 h-5 rounded-full bg-amber-600 text-white flex items-center justify-center text-[10px] font-bold">2</span>
                      <i className="fa-solid fa-brain text-amber-600"></i>
                      <span>Anthropic Claude — Claude Project</span>
                    </div>
                    <ol className="list-decimal list-inside space-y-1 text-slate-600 pl-2">
                      <li>Go to <strong>Claude</strong> ➔ <strong>Projects</strong> ➔ click <strong>Create Project</strong>.</li>
                      <li>Name it <code>Goal Guru Planning Partner</code>.</li>
                      <li>Click <strong>Set Project Instructions</strong> and paste the <strong>Universal System Prompt</strong>.</li>
                      <li>(Optional) Add project roadmaps or background docs in <strong>Project Knowledge</strong>.</li>
                      <li>Start chats inside the project whenever decomposing goals or replanning!</li>
                    </ol>
                  </div>

                  {/* Google Gemini Gems */}
                  <div className="border border-slate-200 rounded-xl p-3.5 bg-slate-50/50 space-y-2">
                    <div className="flex items-center space-x-2 text-slate-900 font-bold">
                      <span className="w-5 h-5 rounded-full bg-sky-600 text-white flex items-center justify-center text-[10px] font-bold">3</span>
                      <i className="fa-solid fa-gem text-sky-600"></i>
                      <span>Google Gemini — Custom Gem</span>
                    </div>
                    <ol className="list-decimal list-inside space-y-1 text-slate-600 pl-2">
                      <li>Go to <strong>Gemini</strong> ➔ open the <strong>Gem Manager</strong>.</li>
                      <li>Click <strong>New Gem</strong> and name it <code>Goal Guru Planner</code>.</li>
                      <li>Paste the <strong>Universal System Prompt</strong> into the <strong>Instructions</strong> field.</li>
                      <li>Save and use the Gem for interactive goal decomposition.</li>
                    </ol>
                  </div>

                  {/* Developer MCP Server */}
                  <div className="border border-slate-200 rounded-xl p-3.5 bg-slate-50/50 space-y-2">
                    <div className="flex items-center space-x-2 text-slate-900 font-bold">
                      <span className="w-5 h-5 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px] font-bold">4</span>
                      <i className="fa-solid fa-plug text-indigo-600"></i>
                      <span>Developer / IDE MCP Server (Cursor, Claude Code, Antigravity)</span>
                    </div>
                    <p className="text-slate-600">
                      Goal Guru also includes a built-in MCP server for runtime development telemetry and error fixes:
                    </p>
                    <code className="block bg-slate-900 text-slate-200 p-2.5 rounded-lg font-mono text-[11px]">
                      node scripts/mcp-dev-server.cjs
                    </code>
                    <p className="text-[11px] text-slate-500">
                      Exposes <code>poll_dev_errors</code>, <code>get_error_details</code>, <code>mark_error_status</code>, and <code>verify_fix</code> tools.
                    </p>
                  </div>
                </div>
              )}

              {activeTab === 'architecture' && (
                <div className="space-y-3.5 text-xs text-slate-700">
                  <div className="border border-slate-200 rounded-xl p-4 bg-slate-50/50 space-y-2">
                    <h4 className="font-bold text-slate-900 text-sm flex items-center space-x-1.5">
                      <i className="fa-solid fa-layer-group text-brand-600"></i>
                      <span>Dual System Prompt Delivery Strategy (ADR 0017)</span>
                    </h4>
                    <p className="leading-relaxed text-slate-600">
                      Goal Guru solves a fundamental friction in LLM planning: <em>How do we give the AI precise instructions without wasting token context on every interaction?</em>
                    </p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                      <div className="bg-white p-3 rounded-lg border border-slate-200">
                        <span className="font-bold text-slate-900 block mb-1">1. Ad-Hoc / Vanilla Chat</span>
                        <p className="text-[11px] text-slate-500">
                          Every clipboard export embeds a compact fallback preamble so unconfigured vanilla chats remain 100% compliant and output valid proposals.
                        </p>
                      </div>
                      <div className="bg-white p-3 rounded-lg border border-slate-200">
                        <span className="font-bold text-slate-900 block mb-1">2. Persistent Custom Agent</span>
                        <p className="text-[11px] text-slate-500">
                          Persistent agents (Custom GPT, Claude Project) hold the system prompt permanently, saving context tokens and retaining conversation memory.
                        </p>
                      </div>
                    </div>
                  </div>

                  <div className="border border-slate-200 rounded-xl p-4 bg-slate-50/50 space-y-2">
                    <h4 className="font-bold text-slate-900 text-sm flex items-center space-x-1.5">
                      <i className="fa-solid fa-arrows-spin text-brand-600"></i>
                      <span>The Safe Collaboration Lifecycle</span>
                    </h4>
                    <ol className="list-decimal list-inside space-y-1.5 text-slate-600">
                      <li><strong>Authoritative State</strong>: Goal Guru's local SQLite database always owns the truth; external LLMs never write directly to disk.</li>
                      <li><strong>Selective Review</strong>: Every AI response is imported into Goal Guru as an interactive proposal envelope. You review and select which mutations to accept.</li>
                      <li><strong>Invariants Enforced</strong>: Goal Guru validates parent-child hierarchies, detects circular dependencies, and provides instant 1-click Undo (Ctrl+Z).</li>
                    </ol>
                  </div>
                </div>
              )}
            </div>

            {/* Footer */}
            <div className="flex items-center justify-between pt-4 border-t border-slate-100 mt-4">
              <span className="text-xs text-slate-400">
                Compatible with GPT-4o, Claude 3.5 Sonnet, Gemini 1.5 Pro & local LLMs
              </span>
              <div className="flex space-x-2">
                <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition">
                  Close
                </button>
                <button 
                  onClick={handleCopy}
                  className="px-5 py-2 text-sm bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium shadow flex items-center space-x-2 transition"
                >
                  <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                  <span>{copied ? 'Copied!' : 'Copy System Instructions'}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Error Log Telemetry Modal (ADR 0019)
    function ErrorLogModal({ onClose, onStatusChange }) {
      const [errors, setErrors] = useState([]);
      const [filter, setFilter] = useState('all');
      const [loading, setLoading] = useState(true);
      const [expandedId, setExpandedId] = useState(null);

      const fetchErrors = async () => {
        setLoading(true);
        try {
          const url = filter === 'all' ? '/api/errors' : `/api/errors?status=${filter}`;
          const res = await fetch(url);
          const data = await res.json();
          setErrors(data.errors || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchErrors();
      }, [filter]);

      const handleUpdateStatus = async (id, status) => {
        try {
          await fetch(`/api/errors/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
          });
          fetchErrors();
          onStatusChange();
        } catch (err) {
          console.error(err);
        }
      };

      const handleClearAll = async () => {
        if (!confirm('Are you sure you want to clear all error telemetry?')) return;
        try {
          await fetch('/api/errors', { method: 'DELETE' });
          fetchErrors();
          onStatusChange();
        } catch (err) {
          console.error(err);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl max-w-4xl w-full p-6 shadow-2xl border border-slate-200 flex flex-col max-h-[90vh]">
            <div className="flex items-center justify-between pb-4 border-b border-slate-100">
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 rounded-xl bg-red-100 text-red-600 flex items-center justify-center font-bold">
                  <i className="fa-solid fa-bug text-sm"></i>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h3 className="text-lg font-bold text-slate-900">Database Error Telemetry</h3>
                    <ContextHelpButton
                      title="SQLite Error Telemetry"
                      summary="Goal Guru records uncaught schema and proposal errors in SQLite, making them inspectable in-app or via MCP tools."
                      topicId="safety-undo"
                      termId="collision"
                      align="left"
                    />
                  </div>
                  <p className="text-xs text-slate-500">Captured runtime errors and import exceptions stored in SQLite</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            {/* Filter bar */}
            <div className="flex items-center justify-between py-3 border-b border-slate-100 text-xs">
              <div className="flex items-center space-x-2">
                {['all', 'unresolved', 'resolved', 'ignored'].map((st) => (
                  <button
                    key={st}
                    onClick={() => setFilter(st)}
                    className={`px-3 py-1 rounded-md capitalize font-medium transition ${
                      filter === st
                        ? 'bg-slate-900 text-white'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {st}
                  </button>
                ))}
              </div>
              <div className="flex items-center space-x-2">
                <button
                  onClick={fetchErrors}
                  className="px-2.5 py-1 text-slate-600 hover:text-slate-900 border border-slate-200 rounded-md hover:bg-slate-50"
                  title="Refresh"
                >
                  <i className="fa-solid fa-arrows-rotate"></i>
                </button>
                <button
                  onClick={handleClearAll}
                  className="px-2.5 py-1 text-red-600 hover:text-red-700 border border-red-200 rounded-md hover:bg-red-50 font-medium"
                >
                  Clear All
                </button>
              </div>
            </div>

            {/* Error list */}
            <div className="mt-3 flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-1">
              {loading ? (
                <div className="text-center py-12 text-slate-400 text-sm">Loading telemetry...</div>
              ) : errors.length === 0 ? (
                <div className="text-center py-12 text-slate-400 text-sm">
                  <i className="fa-solid fa-circle-check text-emerald-500 text-2xl mb-2 block"></i>
                  No errors recorded matching filter "{filter}".
                </div>
              ) : (
                errors.map((err) => {
                  const isExpanded = expandedId === err.id;
                  return (
                    <div
                      key={err.id}
                      className={`border rounded-xl p-3.5 text-xs transition ${
                        err.status === 'unresolved'
                          ? 'border-red-200 bg-red-50/30'
                          : 'border-slate-200 bg-white'
                      }`}
                    >
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex-1 space-y-1">
                          <div className="flex items-center space-x-2">
                            <span
                              className={`px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${
                                err.source === 'server'
                                  ? 'bg-purple-100 text-purple-700 border border-purple-200'
                                  : 'bg-cyan-100 text-cyan-700 border border-cyan-200'
                              }`}
                            >
                              {err.source}
                            </span>
                            <span className="px-1.5 py-0.5 rounded text-[10px] font-mono bg-slate-100 text-slate-700">
                              {err.category}
                            </span>
                            <span className="text-[11px] text-slate-400">
                              {new Date(err.createdAt).toLocaleString()}
                            </span>
                          </div>
                          <p className="font-semibold text-slate-900 text-sm">{err.message}</p>
                        </div>
                        <div className="flex items-center space-x-1.5">
                          {err.status === 'unresolved' ? (
                            <button
                              onClick={() => handleUpdateStatus(err.id, 'resolved')}
                              className="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-medium shadow-sm"
                            >
                              Resolve
                            </button>
                          ) : (
                            <button
                              onClick={() => handleUpdateStatus(err.id, 'unresolved')}
                              className="px-2 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded text-[11px] font-medium"
                            >
                              Reopen
                            </button>
                          )}
                          <button
                            onClick={() => setExpandedId(isExpanded ? null : err.id)}
                            className="p-1 text-slate-400 hover:text-slate-600 rounded"
                            title="Toggle stack & context"
                          >
                            <i className={`fa-solid ${isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'}`}></i>
                          </button>
                        </div>
                      </div>

                      {isExpanded && (
                        <div className="mt-3 pt-3 border-t border-slate-200/60 space-y-2">
                          {err.stack && (
                            <div>
                              <p className="font-semibold text-[11px] text-slate-600 mb-1">Stack Trace:</p>
                              <pre className="bg-slate-900 text-slate-100 p-2.5 rounded-lg text-[11px] font-mono overflow-x-auto whitespace-pre-wrap max-h-48 custom-scrollbar">
                                {err.stack}
                              </pre>
                            </div>
                          )}
                          {err.contextJson && (
                            <div>
                              <p className="font-semibold text-[11px] text-slate-600 mb-1">Context JSON:</p>
                              <pre className="bg-slate-800 text-amber-200 p-2.5 rounded-lg text-[11px] font-mono overflow-x-auto whitespace-pre-wrap max-h-40 custom-scrollbar">
                                {err.contextJson}
                              </pre>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>

            <div className="flex justify-end pt-4 border-t border-slate-100 mt-4">
              <button
                onClick={onClose}
                className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Global client-side error listeners
    window.addEventListener('error', (e) => {
      fetch('/api/errors', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          category: 'window_onerror',
          message: e.message || 'Script error',
          stack: e.error?.stack,
          contextJson: JSON.stringify({ filename: e.filename, lineno: e.lineno, colno: e.colno })
        })
      }).catch(() => {});
    });

    window.addEventListener('unhandledrejection', (e) => {
      fetch('/api/errors', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          category: 'unhandled_promise_rejection',
          message: e.reason?.message || String(e.reason),
          stack: e.reason?.stack,
        })
      }).catch(() => {});
    });

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
